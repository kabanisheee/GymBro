<style>
/* Layout: one narrow phone column; condensed scoreboard numerals carry the identity, everything else stays quiet */
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --sunk:#E2E5DE; --ink:#14171A; --muted:#646B63; --line:#D3D7CF;
  --accent:#2346C8; --accent-ink:#FFFFFF; --accent-soft:#DCE2F8; --accent-text:#2346C8;
  --up:#1B7F45; --down:#B8332A; --warn:#B86A00; --scrim:rgba(20,23,26,.45); --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.75); --glass-hl:rgba(255,255,255,.55); --glass-sh:rgba(30,40,70,.2);
  --font-d:'Fira Sans Extra Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}

:root[data-theme="dark"][data-accent="red"]{--accent:#FF3B30;--accent-ink:#FFFFFF;--accent-soft:#4A1714;--accent-text:#FF5A50}
:root[data-accent="orange"]{--accent:#FF6A00;--accent-ink:#FFFFFF;--accent-soft:#FFE4CF;--accent-text:#D95500}
@media (prefers-color-scheme: dark){:root[data-accent="orange"]:not([data-theme="light"]){--accent:#FF8A1F;--accent-ink:#1F0E00;--accent-soft:#4A2810;--accent-text:#FF9533}}
:root[data-theme="dark"][data-accent="orange"]{--accent:#FF8A1F;--accent-ink:#1F0E00;--accent-soft:#4A2810;--accent-text:#FF9533}

:root[data-theme="dark"][data-accent="yellow"]{--accent:#FFD34D;--accent-ink:#1D1700;--accent-soft:#3A3216;--accent-text:#FFD34D}
:root[data-accent="green"]{--accent:#1E8A4C;--accent-ink:#FFFFFF;--accent-soft:#D8F0E1;--accent-text:#1E8A4C}
@media (prefers-color-scheme: dark){:root[data-accent="green"]:not([data-theme="light"]){--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}}
:root[data-theme="dark"][data-accent="green"]{--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}
:root[data-accent="cyan"]{--accent:#0A86B8;--accent-ink:#FFFFFF;--accent-soft:#D4ECF6;--accent-text:#0A7AA8}

:root[data-theme="dark"][data-accent="cyan"]{--accent:#5CC8F0;--accent-ink:#04161E;--accent-soft:#12303B;--accent-text:#5CC8F0}
:root[data-accent="blue"]{--accent:#2346C8;--accent-ink:#FFFFFF;--accent-soft:#DCE2F8;--accent-text:#2346C8}
@media (prefers-color-scheme: dark){:root[data-accent="blue"]:not([data-theme="light"]){--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}
:root[data-accent="gray"]{--accent:#5B6470;--accent-ink:#FFFFFF;--accent-soft:#E2E5E9;--accent-text:#4A525C}
@media (prefers-color-scheme: dark){:root[data-accent="gray"]:not([data-theme="light"]){--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}}
:root[data-theme="dark"][data-accent="gray"]{--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}
:root[data-accent="violet"]{--accent:#7A3DC8;--accent-ink:#FFFFFF;--accent-soft:#EADDF8;--accent-text:#7A3DC8}
@media (prefers-color-scheme: dark){:root[data-accent="violet"]:not([data-theme="light"]){--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}}
:root[data-theme="dark"][data-accent="violet"]{--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}
:root[data-accent="pink"]{--accent:#D23A7E;--accent-ink:#FFFFFF;--accent-soft:#FADDEA;--accent-text:#C22F70}
@media (prefers-color-scheme: dark){:root[data-accent="pink"]:not([data-theme="light"]){--accent:#FF8DBF;--accent-ink:#2A0A18;--accent-soft:#45202F;--accent-text:#FF8DBF}}
:root[data-theme="dark"][data-accent="pink"]{--accent:#FF8DBF;--accent-ink:#2A0A18;--accent-soft:#45202F;--accent-text:#FF8DBF}

:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition:none!important}
:root[data-anim="off"] :is(.btn,.pill,.tab,.exhead,.gear,.xbtn,.card,.nlink,.linkbtn,.seg button,.hist>button,.sw i){transform:none!important}
:root{--acc-hi:color-mix(in srgb,var(--accent) 72%,#fff);--acc-lo:color-mix(in srgb,var(--accent) 78%,#000)}
:root[data-accent="yellow"]{--acc-hi:color-mix(in srgb,var(--accent) 70%,#fff3a0);--acc-lo:color-mix(in srgb,var(--accent) 80%,#d06000)}
.gs1{stop-color:var(--acc-hi)} .gs2{stop-color:var(--acc-lo)}
:root[data-grad="on"] .btn.primary,:root[data-grad="on"] .banner,:root[data-grad="on"] .replbar,:root[data-grad="on"] .cal .c.on,:root[data-grad="on"] .prog span.on{background:linear-gradient(135deg,var(--acc-hi),var(--acc-lo));border-color:transparent}
:root[data-grad="on"] .chart .bar{fill:url(#gB)}
:root[data-grad="on"] .chart .ln{stroke:url(#gL)}
:root[data-grad="on"] .chart .dt.last{fill:var(--acc-lo)}
:root[data-grad="on"] .sw i{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#fff),color-mix(in srgb,var(--c) 78%,#000))}
:root[data-glass="on"] body{background:var(--bg)}
:root[data-glass="on"] :is(.card,.ex,.hist,.confirm,.empty,.tiles>div,.strip){background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-hl),0 12px 32px -16px var(--glass-sh);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
:root[data-glass="on"] .ex.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--glass-brd))}
:root[data-glass="on"] .ex.pick{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
:root[data-glass="on"] .strip{padding-inline:14px;border-top:1px solid var(--glass-brd)}
:root[data-glass="on"] .strip>div+div{border-left-color:var(--glass-brd)}
:root[data-glass="on"] .tiles{background:transparent;border:0;gap:8px;overflow:visible}
:root[data-glass="on"] .tiles>div{border-radius:18px}
:root[data-glass="on"] .hint{background:color-mix(in srgb,var(--sunk) 55%,transparent);border-radius:12px}
:root[data-glass="on"] .setform{background:color-mix(in srgb,var(--accent-soft) 65%,transparent);border-radius:18px;border:1px solid var(--glass-brd)}
:root[data-glass="on"] .btn{border-radius:999px;background:var(--glass-bg);border-color:var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 6px 18px -10px var(--glass-sh);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
:root[data-glass="on"] .btn.primary,:root[data-glass="on"] .banner,:root[data-glass="on"] .replbar{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%);border:1px solid color-mix(in srgb,var(--accent) 82%,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-glass="on"][data-grad="on"] .btn.primary,:root[data-glass="on"][data-grad="on"] .banner,:root[data-glass="on"][data-grad="on"] .replbar{background-image:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--acc-hi),var(--acc-lo))}
:root[data-glass="on"] .banner{border-radius:22px}
:root[data-glass="on"] .replbar{border-radius:18px}
:root[data-glass="on"] .banner .btn,:root[data-glass="on"] .replbar .btn{background:var(--accent-ink);color:var(--accent-text);border-color:transparent}
:root[data-glass="on"] .btn.danger{color:var(--down)}
:root[data-glass="on"] :is(input,textarea,select){background:color-mix(in srgb,var(--surface) 62%,transparent);border-color:var(--glass-brd);border-radius:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-glass="on"] .seg{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:999px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .seg button{border-radius:999px}
:root[data-glass="on"] .seg button.on{box-shadow:inset 0 1px 0 var(--glass-hl),0 3px 10px -4px var(--glass-sh)}
:root[data-glass="on"] .pill,:root[data-glass="on"] .gear{background:var(--glass-bg);border-color:var(--glass-brd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .gear{border-radius:50%;box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .cal .c{border-radius:50%}
:root[data-glass="on"] .setrow{border-bottom-color:var(--glass-brd)}
:root[data-glass="on"] body::before{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
:root[data-glass="on"] .whead{background:var(--glass-bg);border-bottom:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
:root[data-glass="on"] nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:4px;border-radius:30px;background:var(--glass-bg);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 14px 34px -14px var(--glass-sh);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
:root[data-glass="on"] .tab{border-radius:24px;padding:7px 0 8px}
:root[data-glass="on"] .tabind::before{border-radius:24px;inset:0}
:root[data-glass="on"] .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .wrap.nonav{padding-bottom:40px}
.wrap.wk{padding-top:0}
.wk .whead{padding-top:6px}
:root[data-glass="on"] .sheet{background:var(--glass-bg);border:1px solid var(--glass-brd);border-bottom:0;border-radius:28px 28px 0 0;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .toast{background:color-mix(in srgb,var(--ink) 72%,transparent);border-radius:999px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);bottom:calc(92px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .setconf{background:color-mix(in srgb,var(--sunk) 60%,transparent);border-radius:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:22px}
.wrap.nonav{padding-bottom:40px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;font-weight:700;letter-spacing:.01em}
h1{font-size:40px;line-height:1;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase;line-height:1.1}
h3{font-size:20px;line-height:1.15}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px;position:relative}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.sync.local i{background:var(--down)}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.strip>div{padding:10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{padding-left:12px;border-left:1px solid var(--line)}
.strip .num{font-size:30px;line-height:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--font-b);min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.exhead:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);background-clip:border-box}
.btn.big{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.icon{width:40px;padding:0;min-height:40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tpl .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tpl .acts{display:flex;gap:8px}
.tpl .acts .primary{flex:1}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--font-d);font-size:20px;text-transform:uppercase}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.prog span.on{background:var(--accent)}
.prog span.part{background:var(--accent-soft)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.open{border-color:var(--ink)}
.exhead{width:100%;appearance:none;background:none;border:0;color:inherit;text-align:left;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font:inherit}
.exhead .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.exhead h3{overflow-wrap:anywhere}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.go{background:var(--accent-soft);color:var(--accent-text)}
.chip.done{background:var(--ink);color:var(--bg)}
.chip.done svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;margin-right:5px;vertical-align:-1px}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.hint b{color:var(--ink);font-weight:600}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;border-top:1px solid var(--line)}
.sets>div{display:flex;align-items:center;min-height:44px;padding:0;border-bottom:1px solid var(--line)}
.sets>.h{min-height:30px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sets .n{padding-right:18px;color:var(--muted)}
.sets .x{justify-content:flex-end;gap:2px}
.sets>.setedit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:10px!important;background:var(--accent-soft);border-radius:10px;margin:4px 0;border-bottom:0!important}
.setedit>.small{grid-column:1/-1;font-weight:600;color:var(--accent-text)}
.setedit .full{grid-column:1/-1}
.setedit input{font:700 20px var(--font-d);min-height:40px}
.xbtn{appearance:none;border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.xbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.xbtn:hover{color:var(--down);background:var(--sunk)}
.xbtn.ed:hover,.xbtn.ed:active{color:var(--ink);background:var(--sunk)}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setconf{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px!important;background:var(--sunk);border-radius:8px;margin:4px 0;font-size:14px;border-bottom:0!important}
.trash{border-top:1px solid var(--line);padding-top:6px}
.trashhead{appearance:none;border:0;background:none;color:var(--ink);font:inherit;display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;width:100%}

<div id="app"><div class="wrap"><div class="loading">Загрузка…</div></div></div>
<div id="bgl" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const app=document.getElementById('app');
const DAY=864e5;
const SK='gym-diary-settings';
const COLORS=[['red','#E01E1E','#fff','Красный','Red'],['orange','#FF6A00','#fff','Оранжевый','Orange'],['yellow','#E3AA00','#1D1700','Жёлтый','Yellow'],['green','#1E8A4C','#fff','Зелёный','Green'],['cyan','#0A86B8','#fff','Голубой','Light blue'],['blue','#2346C8','#fff','Синий','Blue'],['violet','#7A3DC8','#fff','Фиолетовый','Violet'],['pink','#D23A7E','#fff','Розовый','Pink'],['gray','#5B6470','#fff','Серый','Gray']];
const normS=v=>({theme:['light','dark'].includes(v.theme)?v.theme:'system',lang:v.lang==='en'?'en':'ru',color:v.color||'blue',anim:v.anim!==false,grad:!!v.grad,glass:!!v.glass,glassK:Math.min(100,Math.max(0,v.glassK==null?60:+v.glassK||0)),soft:!v.glass&&!!v.soft,member:/^\d{4}-\d{2}-\d{2}$/.test(v.member||'')?v.member:'',bgBlur:Math.min(40,Math.max(0,+v.bgBlur>=0?+v.bgBlur:12)),bgVis:Math.min(100,Math.max(10,+v.bgVis||45)),btnT:Math.min(80,Math.max(0,+v.btnT||0)),bgX:Math.min(100,Math.max(0,v.bgX==null?50:+v.bgX||0)),bgY:Math.min(100,Math.max(0,v.bgY==null?50:+v.bgY||0)),tone:Math.min(60,Math.max(-60,+v.tone||0)),name:String(v.name||'').trim().slice(0,30),statCol:Array.isArray(v.statCol)?v.statCol.filter(x=>typeof x==='string').slice(0,12):[],statOrder:Array.isArray(v.statOrder)?v.statOrder.filter(x=>typeof x==='string').slice(0,12):[],my:Array.isArray(v.my)?v.my.filter(x=>x&&x.id&&x.n).slice(0,300).map(x=>({id:String(x.id),n:String(x.n).trim().slice(0,60),mg:/^\d+\.\d+$/.test(x.mg||'')?x.mg:'',eq:String(x.eq||'').trim().slice(0,30)})):[],tut:(v.tut&&typeof v.tut==='object')?Object.fromEntries(Object.entries(v.tut).filter(([k,x])=>/^[a-z]+$/.test(k)&&x===true)):{}});
let SET=normS({soft:true});
try{const v=JSON.parse(localStorage.getItem(SK)||'null');if(v)SET=normS(v)}catch(e){}
const EN=()=>SET.lang==='en';
const L=(ru,en)=>EN()?en:ru;
const LOC=()=>EN()?'en-GB':'ru-RU';
const ORIG_THEME=document.documentElement.getAttribute('data-theme');
const BGK='gym-diary-bg';let BG='';try{BG=localStorage.getItem(BGK)||''}catch(e){}
const BGSK='gym-diary-bgs',BGS_MAX=5;let BGS=[],bgsCol=null,gallerySeeded=false;
function loadBgsLocal(){try{BGS=JSON.parse(localStorage.getItem(BGSK)||'[]')}catch(e){BGS=[]}if(BGS.length>BGS_MAX){BGS=BGS.slice(0,BGS_MAX);saveBgsLocal()}}
function saveBgsLocal(){try{localStorage.setItem(BGSK,JSON.stringify(BGS));return true}catch(e){return false}}
function makeThumb(src){try{const c=document.createElement('canvas'),k=150/Math.max(src.width,src.height);c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}catch(e){return ''}}
function addToGallery(data,thumb){if(BGS.some(x=>x.data===data))return;const it={id:uid(),at:Date.now(),data,thumb};BGS.unshift(it);
  const extra=BGS.slice(BGS_MAX);BGS=BGS.slice(0,BGS_MAX);
  if(S.mode==='db'&&bgsCol){bgsCol.doc(it.id).set(it).catch(e=>toast(errMsg(e)));extra.forEach(x=>bgsCol.doc(x.id).delete().catch(()=>{}))}
  else if(!saveBgsLocal()){BGS=BGS.filter(x=>x.id!==it.id);toast(L('Галерея фонов заполнена. Удалите старые фоны в «Мои фоны».','Background gallery is full. Delete old ones in “My backgrounds”.'))}}
function seedGallery(){if(gallerySeeded||!BG)return;gallerySeeded=true;if(BGS.some(x=>x.data===BG))return;const img=new Image();img.onload=()=>{addToGallery(BG,makeThumb(img));softRender()};img.src=BG}
function subBgs(){if(!rootDoc)return;bgsCol=rootDoc.collection('bgs');bgsCol.onSnapshot(s=>{BGS=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);if(BGS.length>BGS_MAX){BGS.slice(BGS_MAX).forEach(x=>bgsCol.doc(x.id).delete().catch(()=>{}));BGS=BGS.slice(0,BGS_MAX)}setTimeout(seedGallery,500);softRender()},e=>toast(errMsg(e)))}
function applyBg(){const r=document.documentElement,l=document.getElementById('bgl');r.style.setProperty('--surf-p',(100-SET.btnT)+'%');r.style.setProperty('--surf-p2',(100-SET.btnT/2)+'%');if(SET.btnT>0)r.setAttribute('data-trans','on');else r.removeAttribute('data-trans');r.style.setProperty('--bg-blur',SET.bgBlur+'px');r.style.setProperty('--bg-op',SET.bgVis/100);r.style.setProperty('--bg-pos',SET.bgX+'% '+SET.bgY+'%');
  if(BG){r.setAttribute('data-bg','on');r.style.setProperty('--bg-img',`url("${BG}")`)}else{r.removeAttribute('data-bg');r.style.removeProperty('--bg-img')}}
function syncThemeColor(){try{const c=getComputedStyle(document.body||document.documentElement).backgroundColor;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.setAttribute('content',c);m.removeAttribute('media')})}catch(e){}}
const TONE_PROPS=['--accent','--accent-ink','--accent-soft','--accent-text'];
function applyTone(){const r=document.documentElement;TONE_PROPS.forEach(p=>r.style.removeProperty(p));const t=SET.tone||0;if(!t)return;
  const hex=getComputedStyle(r).getPropertyValue('--accent').trim();const m=hex.match(/^#?([0-9a-f]{6})$/i);if(!m)return;
  const c=[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)),to=t>0?255:0,k=Math.abs(t)/100,mix=c.map(v=>Math.round(v+(to-v)*k));
  const h='#'+mix.map(v=>v.toString(16).padStart(2,'0')).join('');
  const lum=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)},L_=.2126*lum(mix[0])+.7152*lum(mix[1])+.0722*lum(mix[2]);
  const dark=r.getAttribute('data-theme')==='dark'||(r.getAttribute('data-theme')!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.style.setProperty('--accent',h);r.style.setProperty('--accent-ink',(L_+.05)/.058>1.05/(L_+.05)?'#14171A':'#FFFFFF');
  r.style.setProperty('--accent-soft',`color-mix(in srgb, ${h} ${dark?22:16}%, var(--bg))`);
  r.style.setProperty('--accent-text',!dark&&L_>.2?`color-mix(in srgb, ${h} 62%, #000)`:dark&&L_<.12?`color-mix(in srgb, ${h} 60%, #fff)`:h)}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTone())}catch(e){}
function applyGlassK(){const k=(SET.glassK==null?60:SET.glassK)/100,r=document.documentElement.style;r.setProperty('--gk',k);r.setProperty('--gblur',Math.round(6+k*30)+'px');r.setProperty('--galpha',Math.round(88-k*62)+'%');r.setProperty('--grim',(.15+k*.75).toFixed(2))}
function applySettings(){const r=document.documentElement;applyGlassK();applyBg();setTimeout(syncThemeColor,0);if(SET.theme==='system'){if(ORIG_THEME)r.setAttribute('data-theme',ORIG_THEME);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',SET.theme);r.setAttribute('data-accent',SET.color||'blue');r.setAttribute('data-anim',SET.anim===false?'off':'on');r.setAttribute('data-grad',SET.grad?'on':'off');r.setAttribute('data-glass',SET.glass||SET.soft?'on':'off');r.setAttribute('data-soft',SET.soft?'on':'off');r.lang=SET.lang;document.title=L('Дневник зала','Gym Diary');applyTone()}
applySettings();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const num=n=>(Math.round(n*10)/10).toLocaleString(LOC(),{maximumFractionDigits:1});
const numIn=n=>EN()?String(Math.round(n*10)/10):String(Math.round(n*10)/10).replace('.',',');
const parseNum=s=>{const v=parseFloat(String(s).replace(',','.').trim());return isFinite(v)?v:NaN};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const sow=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const fD=t=>new Date(t).toLocaleDateString(LOC(),{day:'numeric',month:'short'}).replace('.','');
const fDY=t=>new Date(t).toLocaleDateString(LOC(),{day:'numeric',month:'long',year:'numeric'});
const fT=t=>new Date(t).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'});
const ruP=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c};
const P=(n,ru,en)=>EN()?(n===1?en[0]:en[1]):ruP(n,ru[0],ru[1],ru[2]);
const W_RU=['тренировка','тренировки','тренировок'],W_EN=['workout','workouts'];
const ago=t=>{const d=Math.round((sod(Date.now())-sod(t))/DAY);if(d<=0)return L('сегодня','today');if(d===1)return L('вчера','yesterday');return EN()?d+' days ago':d+' '+ruP(d,'день','дня','дней')+' назад'};
const dur=ms=>{const m=Math.max(1,Math.round(ms/6e4));return m<60?m+L(' мин',' min'):Math.floor(m/60)+L(' ч ',' h ')+(m%60)+L(' мин',' min')};
const KG=()=>L('кг','kg');
const delta=(d,unit='')=>{if(d==null||!isFinite(d))return '<span class="d flat">—</span>';if(Math.abs(d)<0.05)return '<span class="d flat">= 0'+unit+'</span>';return d>0?`<span class="d up">▲ +${num(d)}${unit}</span>`:`<span class="d down">▼ −${num(-d)}${unit}</span>`};

const now=new Date();
const S0=()=>({noteGroup:null,noteForm:null,groupForm:null,view:'home',draft:null,openEx:null,confirm:null,err:null,statEx:null,metric:'w',calY:new Date().getFullYear(),calM:new Date().getMonth(),histOpen:null,trashOpen:false,replaceFor:null,skipFor:null,endAsk:false,addOther:false,fx:null});
const S={templates:[],workouts:[],notes:[],body:{id:'main',weights:[]},noteGroup:null,noteForm:null,groupForm:null,ready:false,mode:'pending',view:'home',draft:null,openEx:null,confirm:null,err:null,statEx:null,metric:'w',calY:now.getFullYear(),calM:now.getMonth(),histOpen:null,trashOpen:false,replaceFor:null,skipFor:null,endAsk:false,addOther:false,fx:null};
const motionOK=()=>SET.anim!==false&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const fx=(t,id)=>S.fx&&S.fx.t===t&&(id==null||S.fx.id===id)?'fx-'+t:'';
const errText=k=>({
  weight:L('Введите вес числом, например 62,5. Для упражнений без веса введите 0.','Enter the weight as a number, e.g. 62.5. Use 0 for bodyweight exercises.'),
  reps:L('Введите количество повторений целым числом.','Enter the number of reps as a whole number.'),
  other:L('Введите название упражнения.','Enter the exercise name.'),
  tname:L('Введите название тренировки.','Enter a workout name.'),
  tex:L('Добавьте хотя бы одно упражнение с названием.','Add at least one exercise with a name.'),
  gname:L('Введите название группы.','Enter a group name.'),
  nempty:L('Заполните хотя бы одно поле: название, ссылку или текст.','Fill in at least one field: title, link or text.'),
  url:L('Ссылка выглядит неверно. Пример: youtube.com/watch?v=…','The link looks wrong. Example: youtube.com/watch?v=…')
}[k]||'');

/* ---------- storage ---------- */
let cols=null,rootDoc=null,bgDoc=null;const chains={};const LK='gym-diary-v1';
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify({templates:S.templates,workouts:S.workouts,notes:S.notes,body:S.body}))}catch(e){}}
function loadLocal(){loadBgsLocal();setTimeout(seedGallery,0);try{const d=JSON.parse(localStorage.getItem(LK)||'{}');if(d.body)S.body=Object.assign({id:'main',weights:[]},d.body);S.templates=d.templates||[];S.workouts=d.workouts||[];S.notes=d.notes||[]}catch(e){}}
function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return L('Хранилище заполнено. Очистите корзину или удалите старые тренировки.','Storage is full. Empty the trash or delete old workouts.');if(c==='invalid_argument')return L('Нет прав на запись в этом приложении.','You do not have permission to save here.');return L('Не удалось сохранить. Проверьте интернет и повторите.','Could not save. Check your connection and try again.')}
function persist(kind,obj){
  if(S.mode!=='db'){saveLocal();return}
  const key=kind+'/'+obj.id,data=JSON.parse(JSON.stringify(obj));
  chains[key]=(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(obj.id).set(data)).catch(e=>toast(errMsg(e)));
}
function remove(kind,id){
  if(S.mode!=='db'){saveLocal();return}
  const key=kind+'/'+id;
  chains[key]=(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(id).delete()).catch(e=>toast(errMsg(e)));
}
function saveSettings(){
  try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}
  if(S.mode==='db'&&rootDoc){const data={settings:normS(SET)};chains.root=(chains.root||Promise.resolve()).then(()=>rootDoc.set(data)).catch(e=>toast(errMsg(e)))}
}
const FB_OK=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!/ВСТАВЬТЕ|YOUR/i.test(c.apiKey))};
function fbReady(){return new Promise(res=>{if(window.gymFb)return res(true);const t=setTimeout(()=>res(false),12000);window.addEventListener('gymfb',()=>{clearTimeout(t);res(true)},{once:true})})}
let unsubs=[];
function startDb(uid){
  S.mode='db';S.user=window.gymFb.currentEmail();
  rootDoc=window.gymFb.userDoc(uid);
  cols={templates:rootDoc.collection('templates'),workouts:rootDoc.collection('workouts'),notes:rootDoc.collection('notes'),body:rootDoc.collection('body')};
  let a=false,b=false,c=false;const done=()=>{if(a&&b&&c){S.ready=true;if(S.view==='login')S.view='home'}softRender()};
  const onErr=e=>toast(errMsg(e));
  bgDoc=rootDoc.collection('media').doc('bg');subBgs();subBody();
  unsubs.push(bgDoc.onSnapshot(d=>{const v=d.exists?(d.data().data||''):'';if(v!==BG&&(d.exists||!d.metadata.hasPendingWrites)){BG=v;try{v?localStorage.setItem(BGK,v):localStorage.removeItem(BGK)}catch(e){}applyBg();softRender()}},onErr));
  unsubs.push(rootDoc.onSnapshot(d=>{const v=d.exists&&d.data().settings;if(v&&JSON.stringify(normS(v))!==JSON.stringify(normS(SET))){SET=normS(v);try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}applySettings();render()}},onErr));

      else{
        const prev=prevFor(e.name,w.id);const tid=catIdByName(e.name);if(tid&&TK.EX[tid])h+=`<button class="techbtn" data-act="techOpen" data-id="${tid}"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z" fill="currentColor" stroke="none"/></svg>${L('Техника выполнения','Technique')}</button>`;
        h+=prev?`<div class="hint">${L('Прошлый раз','Last time')}, ${fD(prev.date)}: <b>${prev.log.map(s=>num(s.w)+'×'+s.r).join(', ')}</b></div>`:`<div class="hint">${L('Раньше не выполнялось','Not done before')}</div>`;
        if(n){h+=`<div class="sets"><div class="h">№</div><div class="h">${L('Вес','Weight')}</div><div class="h">${L('Повторы','Reps')}</div><div class="h"></div>`;const pc=(fx('set',e.id),S.setFx&&S.setFx.id===e.id&&Date.now()<S.setFx.until?'fx-set':'');e.log.forEach((s,i)=>{const c=i===n-1?pc:'';
          if(S.editSet&&S.editSet.ex===e.id&&S.editSet.i===i)h+=`<div class="setedit fx-open"><span class="small muted">${L('Подход','Set')} ${i+1}</span><div class="field"><label for="esw">${L('Вес, кг','Weight, kg')}</label><input id="esw" data-keep data-num="dec" maxlength="6" inputmode="decimal" value="${numIn(s.w)}" autocomplete="off"></div><div class="field"><label for="esr">${L('Повторы','Reps')}</label><input id="esr" data-keep data-num="int" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="${s.r}" autocomplete="off" data-esenter="1"></div>${S.err&&S.err.id==='eset'?`<div class="err full">${esc(errText(S.err.k))}</div>`:''}<div class="exacts full"><button class="btn sm primary" data-act="saveSet">${L('Сохранить','Save')}</button><button class="btn sm" data-act="cancelSet">${L('Отмена','Cancel')}</button></div></div>`;
          else if(S.confirm==='dset:'+e.id+':'+i)h+=`<div class="setconf fx-open"><span>${L('Удалить подход','Delete set')} ${i+1} · <b>${num(s.w)} ${KG()} × ${s.r}</b>?</span><span class="row" style="gap:6px"><button class="btn sm danger" style="border-color:var(--down)" data-act="delSet" data-id="${e.id}:${i}">${L('Удалить','Delete')}</button><button class="btn sm" data-act="noConfirm">${L('Нет','No')}</button></span></div>`;
          else h+=`<div class="n num ${c}">${ov(i+1)}</div><div class="num ${c}">${num(s.w)}<span class="unit">${KG()}</span></div><div class="num ${c}">${s.r}</div><div class="x ${c}"><button class="xbtn ed" data-act="editSet" data-id="${e.id}:${i}" aria-label="${L('Изменить подход','Edit set')} ${i+1}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button><button class="xbtn" data-act="confirm" data-id="dset:${e.id}:${i}" aria-label="${L('Удалить подход','Delete set')} ${i+1}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`});h+='</div>'}
        if(e.pending){
          const lastW=prev&&prev.log&&prev.log[n]?prev.log[n].w:n?e.log[n-1].w:prev&&prev.log&&prev.log.length?prev.log[prev.log.length-1].w:'';
          const tr=parseInt(e.reps);const defR=prev&&prev.log[n]?prev.log[n].r:(isFinite(tr)?tr:'');
          h+=`<div class="setform ${(fx('form',e.id),S.formFx&&S.formFx.id===e.id&&Date.now()<S.formFx.until?'sfin':'')}"><div class="full label" style="color:var(--accent-text)">${L('Подход','Set')} ${ov(n+1)} — ${L('введите результат','enter the result')}</div>
          <div class="field"><label for="w-${e.id}-${n}">${L('Вес, кг','Weight, kg')}</label><input id="w-${e.id}-${n}" data-keep data-num="dec" maxlength="6" inputmode="decimal" value="${lastW===''?'':numIn(lastW)}" autocomplete="off"></div>
          <div class="field"><label for="r-${e.id}-${n}">${L('Повторения','Reps')}</label><input id="r-${e.id}-${n}" data-keep data-num="int" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="${defR}" autocomplete="off" data-enter="${e.id}"></div>
          ${S.err&&S.err.id===e.id?`<div class="full err">${esc(errText(S.err.k))}</div>`:''}
          <button class="btn primary full" data-act="logSet" data-id="${e.id}">${L('Записать подход','Log set')}</button></div>`;
        }
        if(e.done)h+=`<div class="row between"><span class="small muted">${L('Упражнение завершено','Exercise finished')}</span><button class="btn sm ghost" data-act="reopenEx" data-id="${e.id}">${L('Продолжить упражнение','Resume exercise')}</button></div>`;
        else{
          h+=`<div class="exacts"><button class="btn primary big" data-act="startSet" data-id="${e.id}" ${e.pending||n>=setCap(e)?'disabled':''}><span class="stk">${L('Подход','Set')} ${n+1}${(parseInt(e.sets)||0)&&n+1>(parseInt(e.sets)||0)?`<span class="xtra">${L('дополнительно','extra')}</span>`:''}</span></button><button class="btn big" data-act="finishEx" data-id="${e.id}" ${n?'':'disabled'}>${L('Завершить упражнение','Finish exercise')}</button></div>${n>=setCap(e)?`<span class="small muted">${L('Достигнут максимум подходов — на 9 больше плана.','Set limit reached — 9 above the plan.')}</span>`:''}`;
          if(!n)h+=`<div class="exacts"><button class="btn sm" data-act="skipAsk" data-id="${e.id}">${L('Пропустить','Skip')}</button><button class="btn sm" data-act="replaceAsk" data-id="${e.id}" ${e.replaces?`disabled title="${L('Это уже замена. Чтобы выбрать другую — нажмите «Вернуть» у исходного упражнения.','This is already a swap. To pick another, tap “Restore” on the original exercise.')}"`:''}>${L('Заменить','Swap')}</button></div><button class="linkbtn" data-act="offEx" data-id="${e.id}">${L('Отключить упражнение','Turn off exercise')}</button>`;
        }
      }
      h+='</div>';
    }
    h+='</div>';
  }
  h+='</div>';
  if(rf){h+=S.addOther?`<div class="card fx-open"><span class="label">${L('Другое упражнение вместо','Another exercise instead of')} «${esc(rf.name)}»</span>
    <div class="field"><label for="otherName">${L('Название','Name')}</label><div class="inbtn ${S.otherPre?'filled':''}"><input id="otherName" data-keep value="${S.otherPre?esc(S.otherPre.n):''}" placeholder="${L('Например, Тяга гантели в наклоне','E.g. Bent-over dumbbell row')}" autocomplete="off"><button class="catin" data-act="catRepl" aria-label="${L('Выбрать из каталога','Pick from catalog')}"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/></svg><span>${L('Каталог','Catalog')}</span></button></div></div>
    <div class="field"><label for="otherEquip">${L('Снаряд','Equipment')}</label><input id="otherEquip" data-keep list="equipList" value="${S.otherPre?esc(S.otherPre.eq||''):''}" placeholder="${L('Необязательно','Optional')}" autocomplete="off"></div>${equipList()}
    <div class="field"><span class="label mglab">${L('Группа мышц','Muscle group')}</span>${mgBtn('other:1',S.otherMg)}</div>
    <div class="exacts"><div class="field"><label for="otherSets">${L('Подходы','Sets')}</label><input id="otherSets" data-keep data-num="int" maxlength="2" inputmode="numeric" pattern="[0-9]*" value="${esc(rf.sets||3)}"></div><div class="field"><label for="otherReps">${L('Повторения','Reps')}</label><input id="otherReps" data-keep data-num="int" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="${esc(rf.reps||'10')}"></div></div>
    ${S.err&&S.err.id==='other'?`<div class="err">${esc(errText('other'))}</div>`:''}
    <div class="exacts"><button class="btn primary" data-act="addOtherGo">${L('Начать','Start')}</button><button class="btn" data-act="addOtherClose">${L('Отмена','Cancel')}</button></div></div>`:`<button class="btn sm ghost addother" data-act="addOtherOpen">${L('+ Другое упражнение','+ Another exercise')}</button>`}
  if(!rf){h+=S.addNew?`<div class="card fx-open" id="addNewCard"><span class="label">${L('Новое упражнение в тренировку','Add an exercise to the workout')}</span>
    <div class="field"><label for="newName">${L('Название','Name')}</label><div class="inbtn"><input id="newName" data-keep placeholder="${L('Например, Подъём на носки','E.g. Calf raise')}" autocomplete="off"><button class="catin" data-act="catAddW" aria-label="${L('Выбрать из каталога','Pick from catalog')}"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/></svg><span>${L('Каталог','Catalog')}</span></button></div></div>
    <div class="field"><label for="newEquip">${L('Снаряд','Equipment')}</label><input id="newEquip" data-keep list="equipList" placeholder="${L('Необязательно','Optional')}" autocomplete="off"></div>${equipList()}
    <div class="field"><span class="label mglab">${L('Группа мышц','Muscle group')}</span>${mgBtn('other:1',S.otherMg)}</div>
    <div class="exacts"><div class="field"><label for="newSets">${L('Подходы','Sets')}</label><input id="newSets" data-keep data-num="int" maxlength="2" inputmode="numeric" pattern="[0-9]*" value="3"></div><div class="field"><label for="newReps">${L('Повторения','Reps')}</label><input id="newReps" data-keep data-num="int" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="10"></div></div>
    ${S.err&&S.err.id==='addnew'?`<div class="err">${L('Введите название упражнения.','Enter the exercise name.')}</div>`:''}
    <div class="exacts"><button class="btn primary" data-act="addNewGo">${L('Добавить','Add')}</button><button class="btn" data-act="addNewClose">${L('Отмена','Cancel')}</button></div></div>`:`<button class="btn ghost block addnewbtn" data-act="addNewOpen">${L('+ Добавить упражнение','+ Add exercise')}</button>`}
  if(offs.length&&!rf){h+=`<section class="sec" style="gap:6px"><span class="label">${L('Отключено','Turned off')}</span>`;for(const e of offs)h+=`<div class="row between offrow"><span>${esc(e.name)}</span><button class="linkbtn" data-act="unoffEx" data-id="${e.id}">${L('Вернуть','Restore')}</button></div>`;h+='</section>'}
  if(rf){}
  else if(S.confirm==='finish'){let remEx=0,remSets=0,skipped=0;for(const e of ex){if(e.replacedBy)continue;if(e.skipped){skipped++;continue}const p=Math.max(1,parseInt(e.sets)||1),d=Math.min(p,(e.log||[]).length);if(d<p){remEx++;remSets+=p-d}}
    h+=`<div class="confirm"><b>${L('Завершить тренировку?','Finish the workout?')}</b>${remEx?`<span class="small muted">${L('Осталось упражнений:','Exercises left:')} ${remEx} (${remSets} ${EN()?(remSets===1?'planned set':'planned sets'):ruP(remSets,'подход','подхода','подходов')+' по плану'}). ${L('Записанные подходы сохранятся.','Logged sets will be kept.')}</span>`:''}${skipped?`<span class="small muted">${L('Пропущено упражнений:','Skipped exercises:')} ${skipped}</span>`:''}<div class="exacts"><button class="btn primary" data-act="finishW">${L('Завершить','Finish')}</button><button class="btn" data-act="noConfirm">${L('Отмена','Cancel')}</button></div></div>`}
  else if(S.confirm==='cancel')h+=`<div class="confirm"><b>${L('Удалить эту тренировку?','Delete this workout?')}</b><span class="small muted">${L('Все записанные подходы пропадут.','All logged sets will be lost.')}</span><div class="exacts"><button class="btn danger" style="border-color:var(--down)" data-act="cancelW">${L('Удалить','Delete')}</button><button class="btn" data-act="noConfirm">${L('Оставить','Keep')}</button></div></div>`;
  else{const sc=setCount(w);h+=`<div class="stack" data-tut="finish"><button class="btn primary big block" data-act="finishAsk" ${sc?'':'disabled'}>${L('Завершить тренировку','Finish workout')}</button>${sc?'':`<span class="small muted" style="text-align:center">${L('Чтобы завершить тренировку, запишите хотя бы один подход. До этого её можно только отменить.','Log at least one set to finish the workout. Until then you can only cancel it.')}</span>`}`;h+=`<button class="btn danger block" data-act="confirm" data-id="cancel">${L('Отменить тренировку','Cancel workout')}</button></div>`}
  h+='</div>';
  const sk=S.skipFor?all.find(e=>e.id===S.skipFor):null;
  if(sk){const pre=EN()?['No time','Machine taken','Pain or injury','Too tired','Not in the mood']:['Нет времени','Тренажёр занят','Боль или травма','Усталость','Нет настроения'];
    h+=`<div class="overlay ${fx('sheet')}" data-act="skipClose"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="skT"><h2 id="skT">${L('Почему пропускаете','Why are you skipping')} «${esc(sk.name)}»?</h2><span class="small muted">${L('Причина попадёт в отчёт об этой тренировке.','The reason will appear in this workout’s report.')}</span>
    <div class="row" style="gap:6px">${pre.map(r=>`<button class="pill" data-act="skipPreset" data-id="${r}">${r}</button>`).join('')}</div>
    <div class="field"><label for="skipReason">${L('Причина — по желанию','Reason — optional')}</label><textarea id="skipReason" data-keep rows="3" placeholder="${L('Можно оставить пустым','You can leave this empty')}"></textarea><span class="small muted">${L('Указывать причину не обязательно — можно сразу нажать «Пропустить».','A reason is optional — you can just tap Skip.')}</span></div>
    <div class="exacts"><button class="btn primary" data-act="skipYes">${L('Пропустить','Skip')}</button><button class="btn" data-act="skipClose">${L('Отмена','Cancel')}</button></div></div></div>`}
  if(S.endAsk){const pg=progress(w),pre=EN()?['No time','Feeling unwell','Pain or injury','Gym is closing','No energy']:['Нет времени','Плохое самочувствие','Боль или травма','Зал закрывается','Нет сил'];
    h+=`<div class="overlay ${fx('sheet')}" data-act="endClose"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="enT"><h2 id="enT">${L('Короткая тренировка. Почему?','Short workout. Why?')}</h2><span class="small muted">${L('Выполнено','Completed')} ${pg.pct}% ${L('тренировки','of the workout')} (${pg.done} ${L('из','of')} ${pg.plan} ${L('подходов по плану','planned sets')}). ${L('Причина попадёт в отчёт об этой тренировке.','The reason will appear in this workout’s report.')}</span>
    <div class="row" style="gap:6px">${pre.map(r=>`<button class="pill" data-act="endPreset" data-id="${r}">${r}</button>`).join('')}</div>
    <div class="field"><label for="endReason">${L('Причина — по желанию','Reason — optional')}</label><textarea id="endReason" data-keep rows="3" placeholder="${L('Можно оставить пустым','You can leave this empty')}"></textarea><span class="small muted">${L('Указывать причину не обязательно — можно сразу нажать «Завершить».','A reason is optional — you can just tap Finish.')}</span></div>
    <div class="exacts"><button class="btn primary" data-act="endYes">${L('Завершить','Finish')}</button><button class="btn" data-act="endClose">${L('Отмена','Cancel')}</button></div></div></div>`}
  return h;
}

const EQUIP=()=>EN()?['Olympic bar','Straight bar','EZ bar','Triceps bar','Trap bar','Smith machine','Dumbbells','Kettlebell','Cable machine','Machine','Bodyweight','Weight belt','Medicine ball','Resistance band']:['Гриф олимпийский','Гриф прямой','EZ-гриф','Гриф трицепсовый','Трэп-гриф','Смит','Гантели','Гиря','Блочный тренажёр','Тренажёр','Собственный вес','Пояс с отягощением','Медбол','Резинка'];
function equipList(){const own=new Set();for(const t of S.templates)for(const e of t.exercises||[])if(e.equip)own.add(e.equip);for(const x of EQUIP())own.add(x);return `<datalist id="equipList">${[...own].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`}
function vEdit(){
  const d=S.draft;
  let h=`<div class="wrap nonav"><div class="row between" style="padding-top:8px"><button class="btn sm ghost" data-act="editBack"><svg class="bk" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${L('Назад','Back')}</button><span class="small muted">${d.isNew?L('Новый шаблон','New template'):L('Редактирование','Editing')}</span></div>
  <div class="field"><label for="tname">${L('Название тренировки','Workout name')}</label><input id="tname" data-f="name" maxlength="50" value="${esc(d.name)}" placeholder="${L('Например, Спина и бицепс','E.g. Back and biceps')}" autocomplete="off"></div>
  <section class="sec" style="gap:0"><h2 style="margin-bottom:4px">${L('Упражнения','Exercises')}</h2>`;
  d.exercises.forEach((e,i)=>{
    h+=`<div class="edex" data-key="${e.id}"><div class="row between"><span class="idx">${i+1}</span><div class="edtools">${(()=>{const tid=catIdByName(e.name);return tid&&TK.EX[tid]?`<button class="btn icon ghost edpeek" data-act="techOpen" data-id="${tid}" aria-label="${L('Как выполнять','How to do it')}" title="${L('Техника','Technique')}"><svg viewBox="0 0 24 24"><path d="M9 7v10l8-5z"/></svg></button>`:''})()}<button class="btn icon ghost" data-act="mvEx" data-id="${i}:-1" ${i===0?'disabled':''} aria-label="${L('Выше','Up')}">↑</button><button class="btn icon ghost" data-act="mvEx" data-id="${i}:1" ${i===d.exercises.length-1?'disabled':''} aria-label="${L('Ниже','Down')}">↓</button><button class="btn icon danger" data-act="confirm" data-id="dex:${e.id}" aria-label="${L('Удалить упражнение','Remove exercise')}">✕</button></div></div>${S.confirm==='dex:'+e.id?`<div class="setconf fx-open"><span>${L('Удалить упражнение','Remove exercise')} ${e.name?`«${esc(e.name)}»`:i+1}?</span><span class="row" style="gap:6px"><button class="btn sm danger" style="border-color:var(--down)" data-act="delEx" data-id="${i}">${L('Удалить','Remove')}</button><button class="btn sm" data-act="noConfirm">${L('Нет','No')}</button></span></div>`:''}
    <div class="field"><label for="en-${e.id}">${L('Упражнение','Exercise')}</label><div class="inbtn ${String(e.name||'').trim()?'filled':''}"><input id="en-${e.id}" data-ex="${i}" data-k="name" value="${esc(e.name)}" ${e.cat?'readonly class="locked"':''} placeholder="${L('Название','Name')}" autocomplete="off"><button class="catin" data-act="catFor" data-id="${i}" aria-label="${L('Выбрать из каталога','Pick from catalog')}"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10l2 2h6.5A1.5 1.5 0 0 1 20 7.5v11a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M8 11h8M8 15h5"/></svg><span>${L('Каталог','Catalog')}</span></button></div></div>
    <div class="field"><span class="label mglab">${L('Группа мышц','Muscle group')}</span><button class="mgbtn ${e.mg&&mgOk(e.mg)?'set':''}" data-act="mgOpen" data-id="${i}" ${e.cat?'disabled':''}>${e.mg&&mgOk(e.mg)?bodyIcon(e.mg,'sm'):''}<span style="flex:1">${e.mg&&mgOk(e.mg)?esc(mgLabel(e.mg,true)):L('Не выбрана','Not selected')}</span><span class="chev">›</span></button></div>
    <div class="edrow"><div class="field"><label for="eq-${e.id}">${L('Снаряд','Equipment')}</label><input id="eq-${e.id}" data-ex="${i}" data-k="equip" ${e.cat?'readonly class="locked"':'list="equipList"'} value="${esc(e.equip||'')}" placeholder="${L('Необязательно','Optional')}" autocomplete="off"></div>
    <div class="field"><label for="es-${e.id}">${L('Подходы','Sets')}</label><input id="es-${e.id}" data-ex="${i}" data-k="sets" data-num="int" maxlength="2" inputmode="numeric" pattern="[0-9]*" value="${esc(e.sets)}"></div>
    <div class="field"><label for="er-${e.id}">${L('Повторения','Reps')}</label><input id="er-${e.id}" data-ex="${i}" data-k="reps" data-num="int" maxlength="3" inputmode="numeric" pattern="[0-9]*" value="${esc(e.reps)}" placeholder="10"></div></div>
    <div class="field"><label for="ec-${e.id}">${L('Комментарий','Note')}</label><input id="ec-${e.id}" data-ex="${i}" data-k="note" maxlength="140" value="${esc(e.note||'')}" placeholder="${L('Необязательно, например «сиденье на 4»','Optional, e.g. “seat at 4”')}" autocomplete="off"></div></div>`;
  });
  h+=equipList();
  h+=`<div class="addrow"><button class="btn ghost" data-act="addEx">${L('+ Упражнение','+ Exercise')}</button><button class="btn ghost" data-act="catOpen"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>${L('Из каталога','From catalog')}</button></div></section>`;
  if(S.err&&S.err.id==='tpl')h+=`<div class="err">${esc(errText(S.err.k))}</div>`;
  h+=`<button class="btn primary big block" data-act="saveTpl">${L('Сохранить шаблон','Save template')}</button>`;
  if(!d.isNew)h+=`<button class="btn danger block" data-act="delTpl">${L('Переместить шаблон в корзину','Move template to trash')}</button>`;
  return h+'</div>';
}

function ticksFor(mn,mx,n){const sp=mx-mn||1,s0=sp/n,mag=10**Math.floor(Math.log10(s0)),e=s0/mag,st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st,out=[];for(let v=a;v<=b+st/2;v+=st)out.push(Math.round(v*1000)/1000);return out}
function lineChart(pts,unit){
  const W=340,H=190,Lp=42,R=16,T=22,B=26;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn=mn-Math.max(1,mn*0.1);mx=mx+Math.max(1,mx*0.1)}
  const tk=ticksFor(Math.max(0,mn-(mx-mn)*0.1),mx+(mx-mn)*0.1,4);mn=tk[0];mx=tk[tk.length-1];
  const x=i=>pts.length===1?Lp+(W-Lp-R)/2:Lp+i*(W-Lp-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('График','Chart')}"><defs><linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="${Lp}" y1="0" x2="${W-R}" y2="0"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  for(const t of tk)s+=`<line class="grid" x1="${Lp}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${Lp-6}" y="${y(t)+3.5}" text-anchor="end">${num(t)}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  if(pts.length>1)s+=`<path class="ar" d="${d} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z"/><path class="ln" d="${d}"/>`;
  const lbl=new Set([0,pts.length-1]);if(pts.length>4)lbl.add(Math.floor((pts.length-1)/2));
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle class="dt ${last?'last':''}" cx="${x(i)}" cy="${y(p.y)}" r="${last?5:3.5}"/>`;if(lbl.has(i))s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${pts.length===1?'middle':i===0?'start':last?'end':'middle'}">${fD(p.x)}</text>`});
  const lp=pts[pts.length-1];s+=`<text class="vl" x="${Math.min(x(pts.length-1),W-R)}" y="${y(lp.y)-10}" text-anchor="${pts.length===1?'middle':'end'}">${num(lp.y)}${unit}</text>`;
  return s+'</svg>';
}
function barChart(weeks){
  const W=340,H=150,Lp=8,R=8,T=18,B=24,n=weeks.length,mx=Math.max(3,...weeks.map(w=>w.c));
  const bw=(W-Lp-R)/n;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Тренировки по неделям','Workouts per week')}"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  weeks.forEach((w,i)=>{const h=w.c?(H-T-B)*w.c/mx:3,x=Lp+i*bw+bw*0.18,bwi=bw*0.64,y=H-B-h;
    s+=`<rect class="${w.c?'bar':'bar0'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`;
    if(w.c)s+=`<text class="vl" x="${(x+bwi/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${w.c}</text>`;
    if(i%2===(n-1)%2)s+=`<text x="${(x+bwi/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${new Date(w.t).toLocaleDateString(LOC(),{day:'2-digit',month:'2-digit'})}</text>`;});
  return s+'</svg>';
}

function techLoop(){cancelAnimationFrame(TECHRAF);const id=S.tech;if(!id)return;const[pn,eq]=TK.EX[id],pat=TK.PATS[pn],t0=performance.now();let last=-1,lastEl=null;
  const step=now=>{if(S.tech!==id)return;const el=document.getElementById('techSvg');if(!el){TECHRAF=requestAnimationFrame(step);return}
    const T=pat.K?Math.max(2800,pat.K.length*750):pat.walk?1600:2800,ph=((now-t0)%T)/T;let k;
    if(pat.K)k=motionOK()?ph:Math.floor(ph*pat.K.length)/pat.K.length;
    else if(!motionOK())k=ph<.5?0:1;
    else if(pat.walk)k=.5-.5*Math.cos(ph*2*Math.PI);
    else{const e=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;k=ph<.12?0:ph<.48?e((ph-.12)/.36):ph<.62?1:ph<.98?1-e((ph-.62)/.36):0}
    const kk=Math.round(k*200)/200;if(kk!==last||el!==lastEl){last=kk;lastEl=el;el.innerHTML=TK.draw(pat,kk,eq)}
    TECHRAF=requestAnimationFrame(step)};
  TECHRAF=requestAnimationFrame(step)}
