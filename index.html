<style>
/* Layout: one narrow phone column; condensed scoreboard numerals carry the identity, everything else stays quiet */
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --sunk:#E2E5DE; --ink:#14171A; --muted:#646B63; --line:#D3D7CF;
  --accent:#2346C8; --accent-ink:#FFFFFF; --accent-soft:#DCE2F8; --accent-text:#2346C8;
  --up:#1B7F45; --down:#B8332A; --warn:#B86A00; --scrim:rgba(20,23,26,.45); --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.75); --glass-hl:rgba(255,255,255,.55); --glass-sh:rgba(30,40,70,.2);
  --font-d:'Fira Sans Extra Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}

:root[data-accent="orange"]{--accent:#D2600F;--accent-ink:#FFFFFF;--accent-soft:#FBE5D2;--accent-text:#B4520C}

:root[data-theme="dark"][data-accent="orange"]{--accent:#FF9C52;--accent-ink:#241206;--accent-soft:#42271A;--accent-text:#FF9C52}

:root[data-theme="dark"][data-accent="yellow"]{--accent:#FFD34D;--accent-ink:#1D1700;--accent-soft:#3A3216;--accent-text:#FFD34D}
:root[data-accent="green"]{--accent:#1E8A4C;--accent-ink:#FFFFFF;--accent-soft:#D8F0E1;--accent-text:#1E8A4C}
@media (prefers-color-scheme: dark){:root[data-accent="green"]:not([data-theme="light"]){--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}}
:root[data-theme="dark"][data-accent="green"]{--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}

:root[data-theme="dark"][data-accent="cyan"]{--accent:#5CC8F0;--accent-ink:#04161E;--accent-soft:#12303B;--accent-text:#5CC8F0}
:root[data-accent="blue"]{--accent:#2346C8;--accent-ink:#FFFFFF;--accent-soft:#DCE2F8;--accent-text:#2346C8}
@media (prefers-color-scheme: dark){:root[data-accent="blue"]:not([data-theme="light"]){--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}
:root[data-accent="gray"]{--accent:#5B6470;--accent-ink:#FFFFFF;--accent-soft:#E2E5E9;--accent-text:#4A525C}
@media (prefers-color-scheme: dark){:root[data-accent="gray"]:not([data-theme="light"]){--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}}
:root[data-theme="dark"][data-accent="gray"]{--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}
:root[data-accent="violet"]{--accent:#7A3DC8;--accent-ink:#FFFFFF;--accent-soft:#EADDF8;--accent-text:#7A3DC8}
@media (prefers-color-scheme: dark){:root[data-accent="violet"]:not([data-theme="light"]){--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}}
:root[data-theme="dark"][data-accent="violet"]{--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}
:root[data-accent="pink"]{--accent:#D23A7E;--accent-ink:#FFFFFF;--accent-soft:#FADDEA;--accent-text:#C22F70}
@media (prefers-color-scheme: dark){:root[data-accent="pink"]:not([data-theme="light"]){--accent:#FF8DBF;--accent-ink:#2A0A18;--accent-soft:#45202F;--accent-text:#FF8DBF}}
:root[data-theme="dark"][data-accent="pink"]{--accent:#FF8DBF;--accent-ink:#2A0A18;--accent-soft:#45202F;--accent-text:#FF8DBF}

:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition:none!important}
:root[data-anim="off"] :is(.btn,.pill,.tab,.exhead,.gear,.xbtn,.card,.nlink,.linkbtn,.seg button,.hist>button,.sw i){transform:none!important}
:root{--acc-hi:color-mix(in srgb,var(--accent) 72%,#fff);--acc-lo:color-mix(in srgb,var(--accent) 78%,#000)}
:root[data-accent="yellow"]{--acc-hi:color-mix(in srgb,var(--accent) 70%,#fff3a0);--acc-lo:color-mix(in srgb,var(--accent) 80%,#d06000)}
.gs1{stop-color:var(--acc-hi)} .gs2{stop-color:var(--acc-lo)}
:root[data-grad="on"] .btn.primary,:root[data-grad="on"] .banner,:root[data-grad="on"] .replbar,:root[data-grad="on"] .cal .c.on,:root[data-grad="on"] .prog span.on{background:linear-gradient(135deg,var(--acc-hi),var(--acc-lo));border-color:transparent}
:root[data-grad="on"] .chart .bar{fill:url(#gB)}
:root[data-grad="on"] .chart .ln{stroke:url(#gL)}
:root[data-grad="on"] .chart .dt.last{fill:var(--acc-lo)}
:root[data-grad="on"] .sw i{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#fff),color-mix(in srgb,var(--c) 78%,#000))}
:root[data-glass="on"] body{background:var(--bg)}
:root[data-glass="on"] :is(.card,.ex,.hist,.confirm,.empty,.tiles>div,.strip){background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-hl),0 12px 32px -16px var(--glass-sh);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
:root[data-glass="on"] .ex.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--glass-brd))}
:root[data-glass="on"] .ex.pick{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
:root[data-glass="on"] .strip{padding-inline:14px;border-top:1px solid var(--glass-brd)}
:root[data-glass="on"] .strip>div+div{border-left-color:var(--glass-brd)}
:root[data-glass="on"] .tiles{background:transparent;border:0;gap:8px;overflow:visible}
:root[data-glass="on"] .tiles>div{border-radius:18px}
:root[data-glass="on"] .hint{background:color-mix(in srgb,var(--sunk) 55%,transparent);border-radius:12px}
:root[data-glass="on"] .setform{background:color-mix(in srgb,var(--accent-soft) 65%,transparent);border-radius:18px;border:1px solid var(--glass-brd)}
:root[data-glass="on"] .btn{border-radius:999px;background:var(--glass-bg);border-color:var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 6px 18px -10px var(--glass-sh);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
:root[data-glass="on"] .btn.primary,:root[data-glass="on"] .banner,:root[data-glass="on"] .replbar{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%);border:1px solid color-mix(in srgb,var(--accent) 82%,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-glass="on"][data-grad="on"] .btn.primary,:root[data-glass="on"][data-grad="on"] .banner,:root[data-glass="on"][data-grad="on"] .replbar{background-image:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--acc-hi),var(--acc-lo))}
:root[data-glass="on"] .banner{border-radius:22px}
:root[data-glass="on"] .replbar{border-radius:18px}
:root[data-glass="on"] .banner .btn,:root[data-glass="on"] .replbar .btn{background:var(--accent-ink);color:var(--accent-text);border-color:transparent}
:root[data-glass="on"] .btn.danger{color:var(--down)}
:root[data-glass="on"] :is(input,textarea,select){background:color-mix(in srgb,var(--surface) 62%,transparent);border-color:var(--glass-brd);border-radius:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-glass="on"] .seg{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:999px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .seg button{border-radius:999px}
:root[data-glass="on"] .seg button.on{box-shadow:inset 0 1px 0 var(--glass-hl),0 3px 10px -4px var(--glass-sh)}
:root[data-glass="on"] .pill,:root[data-glass="on"] .gear{background:var(--glass-bg);border-color:var(--glass-brd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .gear{border-radius:50%;box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .cal .c{border-radius:50%}
:root[data-glass="on"] .setrow{border-bottom-color:var(--glass-brd)}
:root[data-glass="on"] body::before{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
:root[data-glass="on"] .whead{background:var(--glass-bg);border-bottom:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
:root[data-glass="on"] nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:4px;border-radius:30px;background:var(--glass-bg);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 14px 34px -14px var(--glass-sh);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
:root[data-glass="on"] .tab{border-radius:24px;padding:7px 0 8px}
:root[data-glass="on"] .tabind::before{border-radius:24px;inset:0}
:root[data-glass="on"] .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .wrap.nonav{padding-bottom:40px}
.wrap.wk{padding-top:0}
.wk .whead{padding-top:6px}
:root[data-glass="on"] .sheet{background:var(--glass-bg);border:1px solid var(--glass-brd);border-bottom:0;border-radius:28px 28px 0 0;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .toast{background:color-mix(in srgb,var(--ink) 72%,transparent);border-radius:999px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);bottom:calc(92px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .setconf{background:color-mix(in srgb,var(--sunk) 60%,transparent);border-radius:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:22px}
.wrap.nonav{padding-bottom:40px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;font-weight:700;letter-spacing:.01em}
h1{font-size:40px;line-height:1;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase;line-height:1.1}
h3{font-size:20px;line-height:1.15}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px;position:relative}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.sync.local i{background:var(--down)}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.strip>div{padding:10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{padding-left:12px;border-left:1px solid var(--line)}
.strip .num{font-size:30px;line-height:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--font-b);min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.exhead:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);background-clip:border-box}
.btn.big{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.icon{width:40px;padding:0;min-height:40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tpl .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tpl .acts{display:flex;gap:8px}
.tpl .acts .primary{flex:1}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--font-d);font-size:20px;text-transform:uppercase}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.prog span.on{background:var(--accent)}
.prog span.part{background:var(--accent-soft)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.open{border-color:var(--ink)}
.exhead{width:100%;appearance:none;background:none;border:0;color:inherit;text-align:left;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font:inherit}
.exhead .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.exhead h3{overflow-wrap:anywhere}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.go{background:var(--accent-soft);color:var(--accent-text)}
.chip.done{background:var(--ink);color:var(--bg)}
.chip.done svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;margin-right:5px;vertical-align:-1px}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.hint b{color:var(--ink);font-weight:600}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;border-top:1px solid var(--line)}
.sets>div{display:flex;align-items:center;min-height:44px;padding:0;border-bottom:1px solid var(--line)}
.sets>.h{min-height:30px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sets .n{padding-right:18px;color:var(--muted)}
.sets .x{justify-content:flex-end;gap:2px}
.sets>.setedit{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end;padding:10px!important;background:var(--accent-soft);border-radius:10px;margin:4px 0;border-bottom:0!important}
.setedit>.small{grid-column:1/-1;font-weight:600;color:var(--accent-text)}
.setedit .full{grid-column:1/-1}
.setedit input{font:700 20px var(--font-d);min-height:40px}
.xbtn{appearance:none;border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.xbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.xbtn:hover{color:var(--down);background:var(--sunk)}
.xbtn.ed:hover,.xbtn.ed:active{color:var(--ink);background:var(--sunk)}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setconf{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px!important;background:var(--sunk);border-radius:8px;margin:4px 0;font-size:14px;border-bottom:0!important}
.trash{border-top:1px solid var(--line);padding-top:6px}
.trashhead{appearance:none;border:0;background:none;color:var(--ink);font:inherit;display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;width:100%}

.bgrow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}

  .btn,.tab,.pill,.linkbtn,.exhead,.seg button,.ex,.card,.hist{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,border-color .2s,color .2s,opacity .2s,box-shadow .2s}

  .histbody{animation:slide .2s ease-out}
  .fx-open,.fx-form{animation:slide .22s cubic-bezier(.2,.8,.3,1)}
  .exbody.fx-open{animation:none}
  .fx-set{animation:pop .38s cubic-bezier(.3,1.4,.5,1) both}

  @keyframes exdonet{0%{color:inherit}25%,45%{color:var(--up)}100%{color:inherit}}

  .fx-pop{animation:popin .2s cubic-bezier(.2,.9,.3,1.1)}

  @keyframes popout{from{opacity:1;transform:none}to{opacity:0;transform:scale(.92) translateY(-4px)}}
  @keyframes popin{from{opacity:0;transform:scale(.92) translateY(-4px)}to{opacity:1;transform:none}}
  .fx-pick{animation:rise .28s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i,0)*35ms)}
  .fx-view{animation:fade .22s ease-out}
  .tab.fx-view svg{animation:bounce .35s ease-out}
  .overlay.fx-sheet{animation:fade .18s ease-out}
  .overlay.fx-sheet .sheet{animation:up .26s cubic-bezier(.2,.8,.3,1)}
  .toast.fx-toast{animation:toast .26s cubic-bezier(.2,.8,.3,1)}
  .toast.fx-toast-out{animation:toastout .55s ease-in forwards}
  .xbtn{transition:color .2s,background-color .2s,transform .14s}.xbtn:active{transform:scale(.88)}
  .prog span{transition:background-color .35s}
  .chip{transition:background-color .25s,color .25s}
  .tutbtn.big{animation:tutpulse 2s ease-out infinite}
  @keyframes tutpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .swb{transition:transform .12s}.swb:active{transform:scale(.88)}

  .ck{transition:transform .12s,background-color .2s}.ck:active{transform:scale(.92)}
  .card.grp:active{transform:scale(.985)}.nlink{transition:transform .14s,filter .2s}.nlink:active{transform:scale(.95)}@media (hover:hover){.nlink:hover{filter:brightness(.97)}.card.grp:hover{border-color:var(--muted)}}
  .sw i,.sw i svg{transition:transform .25s cubic-bezier(.3,1.4,.5,1),opacity .2s,box-shadow .25s}.sw:active i{transform:scale(.9)}
  .gear{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,color .2s,border-color .2s}.gear:active{transform:scale(.88);background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
  @media (hover:hover){.gear:hover{border-color:var(--accent);color:var(--accent-text)}}
  .fx-push{animation:push .28s cubic-bezier(.2,.8,.3,1)}
  .catlist.fx-catf>*{animation:catf .34s cubic-bezier(.2,.8,.3,1) both}
  .catlist.fx-catb>*{animation:catb .34s cubic-bezier(.2,.8,.3,1) both}
  .catlist.fx-catf>*:nth-child(2),.catlist.fx-catb>*:nth-child(2){animation-delay:.025s}
  .catlist.fx-catf>*:nth-child(3),.catlist.fx-catb>*:nth-child(3){animation-delay:.05s}
  .catlist.fx-catf>*:nth-child(4),.catlist.fx-catb>*:nth-child(4){animation-delay:.075s}
  .catlist.fx-catf>*:nth-child(5),.catlist.fx-catb>*:nth-child(5){animation-delay:.1s}
  .catlist.fx-catf>*:nth-child(n+6),.catlist.fx-catb>*:nth-child(n+6){animation-delay:.12s}
  h2.fx-catf{animation:catf .3s cubic-bezier(.2,.8,.3,1) both}
  h2.fx-catb{animation:catb .3s cubic-bezier(.2,.8,.3,1) both}
  @keyframes catf{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes catb{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  :root[data-glass="on"] #app>.fx-view{animation:viewg .28s cubic-bezier(.2,.8,.3,1)}
  :root[data-glass="on"] #app>.fx-push{animation:pushg .3s cubic-bezier(.2,.8,.3,1)}
  @keyframes viewg{from{transform:translateY(12px)}to{transform:none}}
  @keyframes pushg{from{transform:translateX(32px)}to{transform:none}}
  :root[data-glass="on"] .overlay.fx-sheet{animation:scrimin .2s ease-out}
  @keyframes scrimin{from{background-color:transparent}}
  @keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes slide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:scale(.8)}60%{opacity:1;transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  @keyframes bounce{0%,100%{transform:scale(1)}45%{transform:scale(1.2)}}
  @keyframes toastout{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,8px)}}
  @keyframes toast{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
}

<body>


<div id="app"><div class="wrap"><div class="loading">Загрузка…</div></div></div>
<div id="bgl" aria-hidden="true"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
const app=document.getElementById('app');
const DAY=864e5;
const SK='gym-diary-settings';
const COLORS=[['red','#C8352B','#fff','Красный','Red'],['orange','#D2600F','#fff','Оранжевый','Orange'],['yellow','#E3AA00','#1D1700','Жёлтый','Yellow'],['green','#1E8A4C','#fff','Зелёный','Green'],['cyan','#0A86B8','#fff','Голубой','Light blue'],['blue','#2346C8','#fff','Синий','Blue'],['violet','#7A3DC8','#fff','Фиолетовый','Violet'],['pink','#D23A7E','#fff','Розовый','Pink'],['gray','#5B6470','#fff','Серый','Gray']];
const normS=v=>({theme:['light','dark'].includes(v.theme)?v.theme:'system',lang:v.lang==='en'?'en':'ru',color:v.color||'blue',anim:v.anim!==false,grad:!!v.grad,glass:!!v.glass,member:/^\d{4}-\d{2}-\d{2}$/.test(v.member||'')?v.member:'',bgBlur:Math.min(40,Math.max(0,+v.bgBlur>=0?+v.bgBlur:12)),bgVis:Math.min(100,Math.max(10,+v.bgVis||45)),btnT:Math.min(80,Math.max(0,+v.btnT||0)),bgX:Math.min(100,Math.max(0,v.bgX==null?50:+v.bgX||0)),bgY:Math.min(100,Math.max(0,v.bgY==null?50:+v.bgY||0)),tone:Math.min(60,Math.max(-60,+v.tone||0)),name:String(v.name||'').trim().slice(0,30),tut:(v.tut&&typeof v.tut==='object')?Object.fromEntries(Object.entries(v.tut).filter(([k,x])=>/^[a-z]+$/.test(k)&&x===true)):{}});
let SET=normS({});
try{const v=JSON.parse(localStorage.getItem(SK)||'null');if(v)SET=normS(v)}catch(e){}
const EN=()=>SET.lang==='en';
const L=(ru,en)=>EN()?en:ru;
const LOC=()=>EN()?'en-GB':'ru-RU';
const ORIG_THEME=document.documentElement.getAttribute('data-theme');
const BGK='gym-diary-bg';let BG='';try{BG=localStorage.getItem(BGK)||''}catch(e){}
const BGSK='gym-diary-bgs',BGS_MAX=12;let BGS=[],bgsCol=null,gallerySeeded=false;
function loadBgsLocal(){try{BGS=JSON.parse(localStorage.getItem(BGSK)||'[]')}catch(e){BGS=[]}}
function saveBgsLocal(){try{localStorage.setItem(BGSK,JSON.stringify(BGS));return true}catch(e){return false}}
function makeThumb(src){try{const c=document.createElement('canvas'),k=150/Math.max(src.width,src.height);c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}catch(e){return ''}}
function addToGallery(data,thumb){if(BGS.some(x=>x.data===data))return;const it={id:uid(),at:Date.now(),data,thumb};BGS.unshift(it);
  const extra=BGS.slice(BGS_MAX);BGS=BGS.slice(0,BGS_MAX);
  if(S.mode==='db'&&bgsCol){bgsCol.doc(it.id).set(it).catch(e=>toast(errMsg(e)));extra.forEach(x=>bgsCol.doc(x.id).delete().catch(()=>{}))}
  else if(!saveBgsLocal()){BGS=BGS.filter(x=>x.id!==it.id);toast(L('Галерея фонов заполнена. Удалите старые фоны в «Мои фоны».','Background gallery is full. Delete old ones in “My backgrounds”.'))}}
function seedGallery(){if(gallerySeeded||!BG)return;gallerySeeded=true;if(BGS.some(x=>x.data===BG))return;const img=new Image();img.onload=()=>{addToGallery(BG,makeThumb(img));softRender()};img.src=BG}
function subBgs(){if(!rootDoc)return;bgsCol=rootDoc.collection('bgs');bgsCol.onSnapshot(s=>{BGS=s.docs.map(d=>d.data()).sort((a,b)=>b.at-a.at);setTimeout(seedGallery,500);softRender()},e=>toast(errMsg(e)))}
function applyBg(){const r=document.documentElement,l=document.getElementById('bgl');r.style.setProperty('--surf-p',(100-SET.btnT)+'%');r.style.setProperty('--surf-p2',(100-SET.btnT/2)+'%');if(SET.btnT>0)r.setAttribute('data-trans','on');else r.removeAttribute('data-trans');r.style.setProperty('--bg-blur',SET.bgBlur+'px');r.style.setProperty('--bg-op',SET.bgVis/100);r.style.setProperty('--bg-pos',SET.bgX+'% '+SET.bgY+'%');
  if(BG){r.setAttribute('data-bg','on');r.style.setProperty('--bg-img',`url("${BG}")`)}else{r.removeAttribute('data-bg');r.style.removeProperty('--bg-img')}}
function syncThemeColor(){try{const c=getComputedStyle(document.body||document.documentElement).backgroundColor;document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.setAttribute('content',c);m.removeAttribute('media')})}catch(e){}}
const TONE_PROPS=['--accent','--accent-ink','--accent-soft','--accent-text'];
function applyTone(){const r=document.documentElement;TONE_PROPS.forEach(p=>r.style.removeProperty(p));const t=SET.tone||0;if(!t)return;
  const hex=getComputedStyle(r).getPropertyValue('--accent').trim();const m=hex.match(/^#?([0-9a-f]{6})$/i);if(!m)return;
  const c=[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)),to=t>0?255:0,k=Math.abs(t)/100,mix=c.map(v=>Math.round(v+(to-v)*k));
  const h='#'+mix.map(v=>v.toString(16).padStart(2,'0')).join('');
  const lum=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)},L_=.2126*lum(mix[0])+.7152*lum(mix[1])+.0722*lum(mix[2]);
  const dark=r.getAttribute('data-theme')==='dark'||(r.getAttribute('data-theme')!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  r.style.setProperty('--accent',h);r.style.setProperty('--accent-ink',(L_+.05)/.058>1.05/(L_+.05)?'#14171A':'#FFFFFF');
  r.style.setProperty('--accent-soft',`color-mix(in srgb, ${h} ${dark?22:16}%, var(--bg))`);
  r.style.setProperty('--accent-text',!dark&&L_>.2?`color-mix(in srgb, ${h} 62%, #000)`:dark&&L_<.12?`color-mix(in srgb, ${h} 60%, #fff)`:h)}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTone())}catch(e){}
function applySettings(){const r=document.documentElement;applyBg();setTimeout(syncThemeColor,0);if(SET.theme==='system'){if(ORIG_THEME)r.setAttribute('data-theme',ORIG_THEME);else r.removeAttribute('data-theme')}else r.setAttribute('data-theme',SET.theme);r.setAttribute('data-accent',SET.color||'blue');r.setAttribute('data-anim',SET.anim===false?'off':'on');r.setAttribute('data-grad',SET.grad?'on':'off');r.setAttribute('data-glass',SET.glass?'on':'off');r.lang=SET.lang;document.title=L('Дневник зала','Gym Diary');applyTone()}
applySettings();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const num=n=>(Math.round(n*10)/10).toLocaleString(LOC(),{maximumFractionDigits:1});
const numIn=n=>EN()?String(Math.round(n*10)/10):String(Math.round(n*10)/10).replace('.',',');
const parseNum=s=>{const v=parseFloat(String(s).replace(',','.').trim());return isFinite(v)?v:NaN};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const sow=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const fD=t=>new Date(t).toLocaleDateString(LOC(),{day:'numeric',month:'short'}).replace('.','');
const fDY=t=>new Date(t).toLocaleDateString(LOC(),{day:'numeric',month:'long',year:'numeric'});
const fT=t=>new Date(t).toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'});
const ruP=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c};
const P=(n,ru,en)=>EN()?(n===1?en[0]:en[1]):ruP(n,ru[0],ru[1],ru[2]);
const W_RU=['тренировка','тренировки','тренировок'],W_EN=['workout','workouts'];
const ago=t=>{const d=Math.round((sod(Date.now())-sod(t))/DAY);if(d<=0)return L('сегодня','today');if(d===1)return L('вчера','yesterday');return EN()?d+' days ago':d+' '+ruP(d,'день','дня','дней')+' назад'};
const dur=ms=>{const m=Math.max(1,Math.round(ms/6e4));return m<60?m+L(' мин',' min'):Math.floor(m/60)+L(' ч ',' h ')+(m%60)+L(' мин',' min')};
const KG=()=>L('кг','kg');
const delta=(d,unit='')=>{if(d==null||!isFinite(d))return '<span class="d flat">—</span>';if(Math.abs(d)<0.05)return '<span class="d flat">= 0'+unit+'</span>';return d>0?`<span class="d up">▲ +${num(d)}${unit}</span>`:`<span class="d down">▼ −${num(-d)}${unit}</span>`};

const now=new Date();
const S0=()=>({noteGroup:null,noteForm:null,groupForm:null,view:'home',draft:null,openEx:null,confirm:null,err:null,statEx:null,metric:'w',calY:new Date().getFullYear(),calM:new Date().getMonth(),histOpen:null,trashOpen:false,replaceFor:null,skipFor:null,endAsk:false,addOther:false,fx:null});
const S={templates:[],workouts:[],notes:[],body:{id:'main',weights:[]},noteGroup:null,noteForm:null,groupForm:null,ready:false,mode:'pending',view:'home',draft:null,openEx:null,confirm:null,err:null,statEx:null,metric:'w',calY:now.getFullYear(),calM:now.getMonth(),histOpen:null,trashOpen:false,replaceFor:null,skipFor:null,endAsk:false,addOther:false,fx:null};
const motionOK=()=>SET.anim!==false&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const fx=(t,id)=>S.fx&&S.fx.t===t&&(id==null||S.fx.id===id)?'fx-'+t:'';
const errText=k=>({
  weight:L('Введите вес числом, например 62,5. Для упражнений без веса введите 0.','Enter the weight as a number, e.g. 62.5. Use 0 for bodyweight exercises.'),
  reps:L('Введите количество повторений целым числом.','Enter the number of reps as a whole number.'),
  other:L('Введите название упражнения.','Enter the exercise name.'),
  tname:L('Введите название тренировки.','Enter a workout name.'),
  tex:L('Добавьте хотя бы одно упражнение с названием.','Add at least one exercise with a name.'),
  gname:L('Введите название группы.','Enter a group name.'),
  nempty:L('Заполните хотя бы одно поле: название, ссылку или текст.','Fill in at least one field: title, link or text.'),
  url:L('Ссылка выглядит неверно. Пример: youtube.com/watch?v=…','The link looks wrong. Example: youtube.com/watch?v=…')
}[k]||'');

/* ---------- storage ---------- */
let cols=null,rootDoc=null,bgDoc=null;const chains={};const LK='gym-diary-v1';
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify({templates:S.templates,workouts:S.workouts,notes:S.notes,body:S.body}))}catch(e){}}
function loadLocal(){loadBgsLocal();setTimeout(seedGallery,0);try{const d=JSON.parse(localStorage.getItem(LK)||'{}');if(d.body)S.body=Object.assign({id:'main',weights:[]},d.body);S.templates=d.templates||[];S.workouts=d.workouts||[];S.notes=d.notes||[]}catch(e){}}
function errMsg(e){const c=e&&e.code;if(c==='quota_exceeded')return L('Хранилище заполнено. Очистите корзину или удалите старые тренировки.','Storage is full. Empty the trash or delete old workouts.');if(c==='invalid_argument')return L('Нет прав на запись в этом приложении.','You do not have permission to save here.');return L('Не удалось сохранить. Проверьте интернет и повторите.','Could not save. Check your connection and try again.')}
function persist(kind,obj){
  if(S.mode!=='db'){saveLocal();return}
  const key=kind+'/'+obj.id,data=JSON.parse(JSON.stringify(obj));
  chains[key]=(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(obj.id).set(data)).catch(e=>toast(errMsg(e)));
}
function remove(kind,id){
  if(S.mode!=='db'){saveLocal();return}
  const key=kind+'/'+id;
  chains[key]=(chains[key]||Promise.resolve()).then(()=>cols[kind].doc(id).delete()).catch(e=>toast(errMsg(e)));
}
function saveSettings(){
  try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}
  if(S.mode==='db'&&rootDoc){const data={settings:normS(SET)};chains.root=(chains.root||Promise.resolve()).then(()=>rootDoc.set(data)).catch(e=>toast(errMsg(e)))}
}
const FB_OK=()=>{const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!/ВСТАВЬТЕ|YOUR/i.test(c.apiKey))};
function fbReady(){return new Promise(res=>{if(window.gymFb)return res(true);const t=setTimeout(()=>res(false),12000);window.addEventListener('gymfb',()=>{clearTimeout(t);res(true)},{once:true})})}
let unsubs=[];
function startDb(uid){
  S.mode='db';S.user=window.gymFb.currentEmail();
  rootDoc=window.gymFb.userDoc(uid);
  cols={templates:rootDoc.collection('templates'),workouts:rootDoc.collection('workouts'),notes:rootDoc.collection('notes'),body:rootDoc.collection('body')};
  let a=false,b=false,c=false;const done=()=>{if(a&&b&&c){S.ready=true;if(S.view==='login')S.view='home'}softRender()};
  const onErr=e=>toast(errMsg(e));
  bgDoc=rootDoc.collection('media').doc('bg');subBgs();subBody();
  unsubs.push(bgDoc.onSnapshot(d=>{const v=d.exists?(d.data().data||''):'';if(v!==BG&&(d.exists||!d.metadata.hasPendingWrites)){BG=v;try{v?localStorage.setItem(BGK,v):localStorage.removeItem(BGK)}catch(e){}applyBg();softRender()}},onErr));
  unsubs.push(rootDoc.onSnapshot(d=>{const v=d.exists&&d.data().settings;if(v&&JSON.stringify(normS(v))!==JSON.stringify(normS(SET))){SET=normS(v);try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}applySettings();render()}},onErr));
  unsubs.push(cols.templates.onSnapshot(s=>{S.templates=s.docs.map(d=>d.data());a=true;done()},onErr));
  unsubs.push(cols.workouts.onSnapshot(s=>{S.workouts=s.docs.map(d=>d.data());b=true;done()},onErr));
  unsubs.push(cols.notes.onSnapshot(s=>{S.notes=s.docs.map(d=>d.data());c=true;done()},onErr));
}
async function init(){
  if(!FB_OK()){S.mode='local';loadLocal();S.ready=true;render();return}
  const ok=await fbReady();
  if(!ok){S.mode='local';loadLocal();S.ready=true;render();toast(L('Не удалось подключиться к облаку. Работаю локально.','Could not reach the cloud. Working locally.'));return}

/* ---------- charts ---------- */
function ticksFor(mn,mx,n){const sp=mx-mn||1,s0=sp/n,mag=10**Math.floor(Math.log10(s0)),e=s0/mag,st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st,out=[];for(let v=a;v<=b+st/2;v+=st)out.push(Math.round(v*1000)/1000);return out}
function lineChart(pts,unit){
  const W=340,H=190,Lp=42,R=16,T=22,B=26;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn=mn-Math.max(1,mn*0.1);mx=mx+Math.max(1,mx*0.1)}
  const tk=ticksFor(Math.max(0,mn-(mx-mn)*0.1),mx+(mx-mn)*0.1,4);mn=tk[0];mx=tk[tk.length-1];
  const x=i=>pts.length===1?Lp+(W-Lp-R)/2:Lp+i*(W-Lp-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('График','Chart')}"><defs><linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="${Lp}" y1="0" x2="${W-R}" y2="0"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  for(const t of tk)s+=`<line class="grid" x1="${Lp}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${Lp-6}" y="${y(t)+3.5}" text-anchor="end">${num(t)}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  if(pts.length>1)s+=`<path class="ar" d="${d} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z"/><path class="ln" d="${d}"/>`;
  const lbl=new Set([0,pts.length-1]);if(pts.length>4)lbl.add(Math.floor((pts.length-1)/2));
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle class="dt ${last?'last':''}" cx="${x(i)}" cy="${y(p.y)}" r="${last?5:3.5}"/>`;if(lbl.has(i))s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${pts.length===1?'middle':i===0?'start':last?'end':'middle'}">${fD(p.x)}</text>`});
  const lp=pts[pts.length-1];s+=`<text class="vl" x="${Math.min(x(pts.length-1),W-R)}" y="${y(lp.y)-10}" text-anchor="${pts.length===1?'middle':'end'}">${num(lp.y)}${unit}</text>`;
  return s+'</svg>';
}
function barChart(weeks){
  const W=340,H=150,Lp=8,R=8,T=18,B=24,n=weeks.length,mx=Math.max(3,...weeks.map(w=>w.c));
  const bw=(W-Lp-R)/n;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Тренировки по неделям','Workouts per week')}"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  weeks.forEach((w,i)=>{const h=w.c?(H-T-B)*w.c/mx:3,x=Lp+i*bw+bw*0.18,bwi=bw*0.64,y=H-B-h;
    s+=`<rect class="${w.c?'bar':'bar0'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`;
    if(w.c)s+=`<text class="vl" x="${(x+bwi/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${w.c}</text>`;
    if(i%2===(n-1)%2)s+=`<text x="${(x+bwi/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${new Date(w.t).toLocaleDateString(LOC(),{day:'2-digit',month:'2-digit'})}</text>`;});
  return s+'</svg>';
}

function vStats(){
  const f=finished();
  let h=`<div class="wrap stats"><div class="top"><div class="ttl"><h1>${L('Статистика','Stats')}</h1>${tutBtn('stats')}</div></div>`;
  if(!f.length)return h+weightStats()+`<div class="empty"><b>${L('Пока нет данных','No data yet')}</b><span>${L('Здесь появятся посещения, графики по упражнениям и рекорды после первой завершённой тренировки.','Attendance, exercise charts and records will appear here after your first finished workout.')}</span></div></div>`;
  const t=Date.now(),wk=sow(t),pwk=sow(wk-DAY);
  const cnt=(a,b)=>f.filter(w=>w.startedAt>=a&&w.startedAt<b).length;

  const avg8=weeks.slice(3,11).reduce((a,w)=>a+w.c,0)/8;

  <div><span class="label">${L('Этот месяц','This month')}</span><span class="num">${cm}</span>${delta(cm-pm)}<span class="small muted">${L('прошлый','last')}: ${pm}</span></div>
  <div><span class="label">${L('В среднем / нед.','Avg / week')}</span><span class="num">${num(avg8)}</span><span class="small muted">${L('за 8 полных недель','over 8 full weeks')}</span></div>
  <div><span class="label">${L('Всего','Total')}</span><span class="num">${f.length}</span><span class="small muted">${L('серия','streak')}: ${streak} ${P(streak,['неделя','недели','недель'],['week','weeks'])}${L(' подряд','')}</span></div>
  </div></section>`;
  h+=`<section class="sec" data-tut="weeks"><div class="row between"><h2>${L('По неделям','By week')}</h2><span class="small muted">${L('12 недель','12 weeks')}</span></div>${barChart(weeks)}</section>`;

  h+=`<section class="sec" data-tut="cal"><div class="row between"><h2>${L('Календарь','Calendar')}</h2><div class="row" style="gap:4px"><button class="btn icon ghost" data-act="cal" data-id="-1" aria-label="${L('Предыдущий месяц','Previous month')}">‹</button><button class="btn icon ghost" data-act="cal" data-id="1" ${isCur?'disabled':''} aria-label="${L('Следующий месяц','Next month')}">›</button></div></div>
  <div class="row between"><b style="text-transform:capitalize">${first.toLocaleDateString(LOC(),{month:'long',year:'numeric'})}</b><span class="small muted">${mc} ${P(mc,W_RU,W_EN)}</span></div><div class="cal">`;
  (EN()?['Mo','Tu','We','Th','Fr','Sa','Su']:['Пн','Вт','Ср','Чт','Пт','Сб','Вс']).forEach(d=>h+=`<div class="wd">${d}</div>`);
  for(let i=0;i<off;i++)h+='<div></div>';
  const td=new Date();for(let d=1;d<=dim;d++){const on=days.has(S.calY+'-'+S.calM+'-'+d),today=isCur&&d===td.getDate();h+=`<div class="c ${on?'on':''} ${today?'today':''}">${d}</div>`}
  h+='</div></section>';
  h+=weightStats();
  const ses=sessions();
  if(ses.size){

    const o=ses.get(S.statEx),Ls=o.list,isW=true,val=p=>p.max,unit=' '+KG();
    const pr=Ls.reduce((a,p)=>!a||p.max>a.max||(p.max===a.max&&p.maxR>a.maxR)?p:a,null);

      h+=S.confirm==='clearTrash'?`<div class="confirm" style="margin-top:12px"><b>${EN()?`Erase ${tr.length} ${P(tr.length,W_RU,W_EN)} forever?`:`Стереть ${tr.length} ${ruP(tr.length,'тренировку','тренировки','тренировок')} навсегда?`}</b><span class="small muted">${L('Восстановить их будет нельзя.','They cannot be restored.')}</span><div class="exacts"><button class="btn danger" style="border-color:var(--down)" data-act="clearTrash">${L('Стереть','Erase')}</button><button class="btn" data-act="noConfirm">${L('Отмена','Cancel')}</button></div></div>`:`<button class="btn danger sm" style="align-self:flex-start;margin-top:12px" data-act="confirm" data-id="clearTrash">${L('Очистить корзину','Empty trash')}</button>`;

function flip(sel,fn){S.holdUntil=Date.now()+650;const before=new Map();document.querySelectorAll(sel).forEach(el=>before.set(el.dataset.key,el.getBoundingClientRect().top));fn();if(!motionOK())return;
  document.querySelectorAll(sel).forEach(el=>{const b=before.get(el.dataset.key);if(b==null||!el.animate)return;const dy=b-el.getBoundingClientRect().top;if(Math.abs(dy)<1)return;el.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:280,easing:'cubic-bezier(.2,.8,.3,1)'})})}
function loadBg(file){if(!/^image\//.test(file.type)){toast(L('Выберите файл изображения.','Choose an image file.'));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);let max=1100,q=.75,out='';const c=document.createElement('canvas'),x=c.getContext('2d');
    max=1440;q=.86;const fmt=c.toDataURL('image/webp',.5).startsWith('data:image/webp')?'image/webp':'image/jpeg';for(let i=0;i<10;i++){const k=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL(fmt,q);if(out.length<225000)break;if(q>.6)q-=.08;else max=Math.round(max*.85)}
    if(out.length>=230000){toast(L('Не удалось сжать фото. Попробуйте другое.','Could not compress the photo. Try another one.'));return}
    BG=out;try{localStorage.setItem(BGK,BG)}catch(e){}applyBg();addToGallery(out,makeThumb(c));render();
    if(S.mode==='db'&&bgDoc){bgDoc.set({data:BG,at:Date.now()}).then(()=>toast(L('Фон сохранён','Background saved'))).catch(e=>toast(errMsg(e)))}else toast(L('Фон сохранён','Background saved'))};
  img.onerror=()=>{URL.revokeObjectURL(url);toast(L('Не удалось открыть это фото.','Could not open this photo.'))};img.src=url}
function backupData(){return JSON.stringify({app:'gym-diary',version:1,exportedAt:new Date().toISOString(),settings:normS(SET),bg:BG,templates:S.templates,workouts:S.workouts,notes:S.notes,bgs:BGS,body:S.body})}
async function importData(file){let d;try{d=JSON.parse(await file.text())}catch(e){toast(L('Это не файл резервной копии.','This is not a backup file.'));return}

  let n=0;const merge=(kind,arr)=>{if(!Array.isArray(arr))return;for(const x of arr){if(!x||typeof x.id!=='string')continue;const i=S[kind].findIndex(y=>y.id===x.id);if(i>=0)S[kind][i]=x;else S[kind].push(x);persist(kind,x);n++}};
  merge('templates',d.templates);merge('workouts',d.workouts);merge('notes',d.notes);
  if(d.settings){SET=normS(d.settings);try{localStorage.setItem(SK,JSON.stringify(SET))}catch(e){}saveSettings()}

  if(d.body&&Array.isArray(d.body.weights)){const m=new Map((S.body.weights||[]).map(x=>[x.d,x]));for(const x of d.body.weights)if(x&&x.d&&isFinite(x.w))m.set(x.d,{d:x.d,w:+x.w});S.body=Object.assign({},S.body,d.body.height?{height:d.body.height}:{},d.body.age?{age:d.body.age,ageAt:d.body.ageAt}:{},d.body.sex==='m'||d.body.sex==='f'?{sex:d.body.sex}:{},{id:'main',weights:[...m.values()].sort((a,b)=>a.d<b.d?-1:1)});persist('body',S.body)}
  if(Array.isArray(d.bgs))for(const x of d.bgs.slice().reverse())if(x&&typeof x.data==='string'&&x.data.startsWith('data:image/'))addToGallery(x.data,x.thumb||'');
  applySettings();render();toast(L('Импортировано записей: ','Records imported: ')+n)}
function exResults(q){const ses=sessions(),k=norm(q);const list=[...ses.keys()].filter(x=>!k||norm(ses.get(x).name).includes(k)).sort((a,b)=>ses.get(a).name.localeCompare(ses.get(b).name,LOC()));

let DRUM=null;
function drumHtml(keys,ses){DRUM={keys,names:keys.map(k=>ses.get(k).name),idx:Math.max(0,keys.indexOf(S.statEx))};
  return `<div class="drum" id="drum" tabindex="0" role="listbox" aria-label="${L('Упражнение','Exercise')}" aria-activedescendant="drumc"><div class="drum-band" aria-hidden="true"></div><div class="drum-slots"></div><div class="drum-fade" aria-hidden="true"></div></div>`}
function initDrum(){const el=document.getElementById('drum');if(!el||el.dataset.ready||!DRUM)return;el.dataset.ready='1';
  const H=44,R=3,n=DRUM.keys.length,box=el.querySelector('.drum-slots'),slots=[];
  for(let k=-R;k<=R;k++){const d=document.createElement('div');d.className='drum-item';box.appendChild(d);slots.push(d)}
  let pos=DRUM.idx,anim=0,vel=0,drag=null,wheelT=0;
  const mod=x=>((x%n)+n)%n;
  const draw=()=>{const base=Math.round(pos),fr=pos-base;slots.forEach((d,j)=>{const k=j-R,y=(k-fr)*H,dist=Math.abs(k-fr);
    d.textContent=n>1||k===0?DRUM.names[mod(base+k)]:'';d.style.transform=`translateY(${y}px) scale(${Math.max(.78,1-dist*.1)})`;d.style.opacity=Math.max(0,1-dist*.38);
    d.classList.toggle('on',Math.abs(k-fr)<.5);d.id=k===0?'drumc':''})};
  const settle=()=>{const i=mod(Math.round(pos));if(DRUM.keys[i]!==S.statEx){S.statEx=DRUM.keys[i];render()}};
  const snapTo=(target)=>{cancelAnimationFrame(anim);const from=pos,dur=motionOK()?260:0,t0=performance.now();
    const step=t=>{const p=dur?Math.min(1,(t-t0)/dur):1,e=1-Math.pow(1-p,3);pos=from+(target-from)*e;draw();if(p<1)anim=requestAnimationFrame(step);else{pos=target;draw();settle()}};anim=requestAnimationFrame(step)};
  const fling=()=>{cancelAnimationFrame(anim);if(!motionOK()||Math.abs(vel)<.002)return snapTo(Math.round(pos));let last=performance.now();
    const step=t=>{const dt=t-last;last=t;pos+=vel*dt;vel*=Math.pow(.994,dt);draw();if(Math.abs(vel)>.0015)anim=requestAnimationFrame(step);else snapTo(Math.round(pos+vel*80))};anim=requestAnimationFrame(step)};
  if(n<2){draw();return}
  el.addEventListener('pointerdown',e=>{cancelAnimationFrame(anim);drag={y:e.clientY,p:pos,t:performance.now(),ly:e.clientY,lt:performance.now(),moved:false};vel=0;try{el.setPointerCapture(e.pointerId)}catch(x){}});
  el.addEventListener('pointermove',e=>{if(!drag)return;const now=performance.now(),dy=e.clientY-drag.y;if(Math.abs(dy)>4)drag.moved=true;pos=drag.p-dy/H;
    const dt=now-drag.lt;if(dt>0){vel=.7*vel+.3*(-(e.clientY-drag.ly)/H/dt)}drag.ly=e.clientY;drag.lt=now;draw()});
  const up=e=>{if(!drag)return;const d=drag;drag=null;
    if(!d.moved){const r=el.getBoundingClientRect(),off=Math.round((e.clientY-(r.top+r.height/2))/H);if(off)return snapTo(Math.round(pos)+off);return snapTo(Math.round(pos))}
    if(performance.now()-d.lt>80)vel=0;fling()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const steps=Math.abs(e.deltaY)>=50?Math.sign(e.deltaY):e.deltaY/50;pos+=steps;draw();clearTimeout(wheelT);wheelT=setTimeout(()=>snapTo(Math.round(pos)),120)},{passive:false});
  el.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();snapTo(Math.round(pos)+(e.key==='ArrowDown'?1:-1))}});
  draw()}

function calcEval(src){const t=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let i=0;

  restoreW(id){const i=S.workouts.findIndex(w=>w.id===id);if(i<0)return;const w=structuredClone(S.workouts[i]);delete w.deletedAt;S.workouts[i]=w;persist('workouts',w);render();toast(L('Тренировка восстановлена','Workout restored'))},
  trashToggle(){S.trashOpen=!S.trashOpen;S.confirm=null;render()},
  clearTrash(){const ids=S.workouts.filter(w=>w.deletedAt).map(w=>w.id);S.workouts=S.workouts.filter(w=>!w.deletedAt);ids.forEach(id=>remove('workouts',id));S.confirm=null;S.trashOpen=false;render();toast(L('Корзина очищена','Trash emptied'))},
  gKind(k){S.groupKind=k;render()},
  newGroup(){S.groupKind='links';S.groupForm='new';S.err=null;render();const el=document.getElementById('gName');if(el)el.focus()},
  renameGroup(){const g=S.notes.find(x=>x.id===S.noteGroup);S.groupKind=g&&g.kind==='text'?'text':'links';S.groupForm='rename';S.err=null;render();const el=document.getElementById('gName');if(el){el.focus();el.select()}},
  cancelGroup(){S.groupForm=null;S.err=null;render()},
  saveGroup(){const el=document.getElementById('gName'),name=(el?el.value:'').trim();if(!name){S.err={id:'group'};return render()}
    S.err=null;if(S.groupForm==='rename'&&S.noteGroup){S.groupForm=null;const kind=S.groupKind==='text'?'text':'links';mutG(S.noteGroup,g=>{g.name=name;g.kind=kind});return}
    const g={id:uid(),name,kind:S.groupKind==='text'?'text':'links',createdAt:Date.now(),items:[]};S.notes.push(g);persist('notes',g);S.groupForm=null;S.noteGroup=g.id;S.fx={t:'view'};render();toast(L('Группа создана','Group created'))},
  openGroup(id){S.sel=null;S.gsel=null;S.noteGroup=id;S.nTrashOpen=false;S.noteForm=null;S.groupForm=null;S.confirm=null;S.err=null;S.fx={t:'view'};render();window.scrollTo(0,0)},
  backNotes(){S.sel=null;S.noteGroup=null;S.noteForm=null;S.groupForm=null;S.confirm=null;S.err=null;S.fx={t:'view'};render();window.scrollTo(0,0)},
  delGroup(){const id=S.noteGroup,i=S.notes.findIndex(x=>x.id===id);S.noteGroup=null;S.confirm=null;S.groupForm=null;S.noteForm=null;S.fx={t:'view'};if(i>=0){const g=structuredClone(S.notes[i]);g.deletedAt=Date.now();S.notes[i]=g;persist('notes',g)}render();window.scrollTo(0,0);toast(L('Группа в корзине','Group moved to trash'))},
  restoreGroup(id){const i=S.notes.findIndex(x=>x.id===id);if(i<0)return;const g=structuredClone(S.notes[i]);delete g.deletedAt;S.notes[i]=g;persist('notes',g);render();toast(L('Группа восстановлена','Group restored'))},
  gTrashToggle(){S.gTrashOpen=!S.gTrashOpen;S.confirm=null;render()},
  clearGTrash(){const ids=S.notes.filter(x=>x.deletedAt).map(x=>x.id);S.notes=S.notes.filter(x=>!x.deletedAt);ids.forEach(id=>remove('notes',id));S.confirm=null;S.gTrashOpen=false;render();toast(L('Корзина очищена','Trash emptied'))},
  newNote(){S.noteForm={id:null};S.confirm=null;S.err=null;render();const el=document.getElementById('nT-new');if(el){el.focus();el.scrollIntoView({block:'center'})}},
  editNote(id){S.noteForm={id};S.confirm=null;S.err=null;render();const el=document.getElementById('nT-'+id);if(el)el.focus()},
  cancelNote(){S.noteForm=null;S.err=null;render()},
  saveNote(k){const g=v=>((document.getElementById(v+'-'+k)||{}).value||'').trim();const title=g('nT'),raw=g('nU'),text=g('nX');
    if(!title&&!raw&&!text){S.err={id:'note',k:'nempty'};return render()}
    const url=normUrl(raw);if(url===null){S.err={id:'note',k:'url'};return render()}
    S.err=null;const id=S.noteForm&&S.noteForm.id;S.noteForm=null;
    mutG(S.noteGroup,gr=>{if(id){const n=gr.items.find(x=>x.id===id);if(n)Object.assign(n,{title,url:document.getElementById('nU-'+k)?url:(n.url||''),text,updatedAt:Date.now()})}else gr.items.push({id:uid(),title,url,text,createdAt:Date.now()})});toast(L('Заметка сохранена','Note saved'))},
  selNote(id){if(!S.sel)return;S.confirm=null;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);if(!S.sel.size)S.sel=null;render()},
  selAll(){if(!S.sel)return;const g=S.notes.find(x=>x.id===S.noteGroup),it=g?live(g):[];S.confirm=null;S.sel=S.sel.size===it.length?new Set():new Set(it.map(n=>n.id));render()},
  selGroup(id){if(!S.gsel)return;S.confirm=null;S.gsel.has(id)?S.gsel.delete(id):S.gsel.add(id);if(!S.gsel.size)S.gsel=null;render()},
  gselAll(){if(!S.gsel)return;const G=groups();S.confirm=null;S.gsel=S.gsel.size===G.length?new Set():new Set(G.map(x=>x.id));render()},
  gselCancel(){S.gsel=null;S.confirm=null;render()},
  gselAsk(){if(S.gsel&&S.gsel.size){S.confirm='gselDel';render()}},
  gselDel(){const ids=S.gsel;if(!ids||!ids.size)return;const c=ids.size,t=Date.now();S.gsel=null;S.confirm=null;const ch=[];S.notes=S.notes.map(x=>{if(!ids.has(x.id)||x.deletedAt)return x;const g=structuredClone(x);g.deletedAt=t;ch.push(g);return g});ch.forEach(g=>persist('notes',g));render();toast(EN()?`${c} ${c===1?'group':'groups'} moved to trash`:`${c} ${ruP(c,'группа перемещена','группы перемещены','групп перемещено')} в корзину`)},
  selCancel(){S.sel=null;S.confirm=null;render()},
  selAsk(){if(S.sel&&S.sel.size){S.confirm='selDel';render()}},
  selDel(){const ids=S.sel;if(!ids||!ids.size)return;const c=ids.size,t=Date.now();S.sel=null;S.confirm=null;mutG(S.noteGroup,g=>{for(const n of g.items)if(ids.has(n.id)&&!n.deletedAt)n.deletedAt=t});toast(EN()?`${c} ${c===1?'note':'notes'} moved to trash`:`${c} ${ruP(c,'заметка перемещена','заметки перемещены','заметок перемещено')} в корзину`)},
  delNote(id){S.confirm=null;if(S.noteForm&&S.noteForm.id===id)S.noteForm=null;mutG(S.noteGroup,g=>{const n=g.items.find(x=>x.id===id);if(n)n.deletedAt=Date.now()});toast(L('Заметка в корзине','Note moved to trash'))},
  restoreNote(id){mutG(S.noteGroup,g=>{const n=g.items.find(x=>x.id===id);if(n)delete n.deletedAt});toast(L('Заметка восстановлена','Note restored'))},
  nTrashToggle(){S.nTrashOpen=!S.nTrashOpen;S.confirm=null;render()},
  clearNTrash(){S.confirm=null;S.nTrashOpen=false;mutG(S.noteGroup,g=>{g.items=g.items.filter(x=>!x.deletedAt)});toast(L('Корзина очищена','Trash emptied'))},
  editSet(v){const[ex,i]=v.split(':');S.editSet={ex,i:+i};S.confirm=null;S.err=null;render();const el=document.getElementById('esw');if(el){el.focus();el.select()}},
  cancelSet(){S.editSet=null;S.err=null;render()},
  saveSet(){const es=S.editSet;if(!es)return;const wv=parseNum((document.getElementById('esw')||{}).value),rv=parseNum((document.getElementById('esr')||{}).value);
    if(!isFinite(wv)||wv<0){S.err={id:'eset',k:'weight'};return render()}
    if(!isFinite(rv)||rv<1||Math.round(rv)!==rv){S.err={id:'eset',k:'reps'};return render()}
    S.editSet=null;S.err=null;S.fx={t:'set',id:es.ex};mutW(w=>{const e=exOf(w,es.ex);if(e&&e.log[es.i])e.log[es.i]={w:wv,r:rv}});toast(L('Подход изменён','Set updated'))},
  delSet(v){S.editSet=null;const[id,i]=v.split(':');S.confirm=null;mutW(w=>{const e=exOf(w,id);e.log.splice(+i,1);if(!e.log.length)e.done=false});toast(L('Подход удалён','Set deleted'))}
};
const LP={t:0,x:0,y:0,fired:false,until:0};
app.addEventListener('pointerdown',e=>{if(S.sel||S.gsel||S.noteForm||S.groupForm||S.view!=='notes'||(e.pointerType==='mouse'&&e.button!==0))return;const c=e.target.closest('.card.note[data-nid],.card.grp[data-gid]');if(!c)return;const bt=e.target.closest('button,input,textarea,.setconf');if(bt&&bt!==c)return;
  clearTimeout(LP.t);LP.x=e.clientX;LP.y=e.clientY;LP.fired=false;c.classList.add('pressing');
  LP.t=setTimeout(()=>{LP.t=0;c.classList.remove('pressing');if(c.dataset.gid)S.gsel=new Set([c.dataset.gid]);else S.sel=new Set([c.dataset.nid]);S.confirm=null;LP.fired=true;try{navigator.vibrate&&navigator.vibrate(18)}catch(_){}render()},480)});
const lpEnd=e=>{if(LP.fired){LP.fired=false;LP.until=Date.now()+400}if(LP.t){clearTimeout(LP.t);LP.t=0}app.querySelectorAll('.pressing').forEach(x=>x.classList.remove('pressing'))};
app.addEventListener('pointerup',lpEnd);app.addEventListener('pointercancel',lpEnd);
app.addEventListener('pointermove',e=>{if(LP.t&&Math.hypot(e.clientX-LP.x,e.clientY-LP.y)>10)lpEnd()});
app.addEventListener('contextmenu',e=>{if(S.view==='notes'&&(S.sel||S.gsel||LP.fired)&&e.target.closest('.card.note,.card.grp'))e.preventDefault()});
app.addEventListener('click',e=>{if(Date.now()<LP.until&&e.target.closest('.card.note,.card.grp')){LP.until=0;e.preventDefault();e.stopPropagation();return}},true);
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset.id,e)});
function cleanNum(v,dec){if(!dec)return v.replace(/\D/g,'');v=v.replace(/[^\d.,]/g,'');const m=v.match(/^(\d*)([.,]?)(\d*)/);return m[1]+(m[2]&&m[1]?m[2]+m[3].replace(/[.,]/g,'').slice(0,2):'')}
app.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.num){const v=cleanNum(t.value,t.dataset.num==='dec');if(v!==t.value)t.value=v}},true);
app.addEventListener('input',e=>{const t=e.target;if(!S.draft)return;if(t.dataset.f==='name')S.draft.name=t.value;else if(t.dataset.ex!=null){const x=S.draft.exercises[+t.dataset.ex];if(x)x[t.dataset.k]=t.value;if(t.dataset.k==='name'&&t.parentNode.classList.contains('inbtn'))t.parentNode.classList.toggle('filled',!!t.value.trim())}});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='exQ'){const r=document.getElementById('exRes');if(r)r.innerHTML=exResults(t.value);return}if(t.id==='catQ'){S.cat.q=t.value;const r=document.getElementById('catRes');if(r){if(t.value.trim())r.innerHTML=catResults(t.value);else{lastHtml=null;render();const q=document.getElementById('catQ');if(q){q.focus()}}}return}if(t.id==='tone'){SET.tone=+t.value;document.getElementById('toneV').textContent=(SET.tone>0?'+':'')+SET.tone;applyTone();return}if(t.id==='bgX'||t.id==='bgY'){const v=+t.value;SET[t.id]=v;document.getElementById(t.id+'V').textContent=v+'%';applyBg();return}if(t.id==='btnT'){SET.btnT=+t.value;document.getElementById('btnTV').textContent=SET.btnT+'%';applyBg();return}if(t.id==='bgBlur'||t.id==='bgVis'){const v=+t.value;if(t.id==='bgBlur'){SET.bgBlur=v;document.getElementById('bgBlurV').textContent=v}else{SET.bgVis=v;document.getElementById('bgVisV').textContent=v+'%'}applyBg()}});
app.addEventListener('change',e=>{if(e.target.id==='nameIn'){const v=String(e.target.value||'').trim().slice(0,30);if(v!==SET.name){SET.name=v;saveSettings();toast(v?L('Имя сохранено','Name saved'):L('Имя убрано','Name removed'))}return}if(['bgBlur','bgVis','btnT','bgX','bgY','tone'].includes(e.target.id)){saveSettings();if(['bgX','bgY','tone'].includes(e.target.id))render();return}if(e.target.id==='impFile'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importData(f);return}if(e.target.id==='bgFile'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)loadBg(f);return}if(e.target.id==='statEx'){S.statEx=e.target.value;render()}if(e.target.id==='memDate'){const v=e.target.value||'';if(v!==SET.member){SET.member=normS({member:v}).member;saveSettings();render();toast(SET.member?L('Дата абонемента сохранена','Membership date saved'):L('Абонемент убран с главного экрана','Membership hidden from home'))}}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){e.preventDefault();A.logSet(e.target.dataset.enter)}if(e.key==='Enter'&&e.target.dataset.bwenter){e.preventDefault();A.bodySave()}if(e.key==='Enter'&&e.target.dataset.esenter){e.preventDefault();A.saveSet()}if(e.key==='Enter'&&e.target.dataset.lenter){e.preventDefault();A.authGo()}if(e.key==='Enter'&&e.target.dataset.genter){e.preventDefault();A.saveGroup()}});
/* ---------- system back gesture ---------- */
let guarded=false,ignorePop=false;
const canBack=()=>S.ready&&S.view!=='login'&&!!(S.mg||S.cat||TUT||S.sel||S.gsel||S.sum||S.bmiInfo||S.bgGal||S.gearMenu||S.exSearch||S.calc||S.skipFor||S.endAsk||S.confirm||S.replaceFor||S.noteForm||S.groupForm||S.noteGroup||S.view!=='home');
function syncHistory(){try{
  if(canBack()&&!guarded){history.pushState({gym:1},'');guarded=true}
  else if(!canBack()&&guarded&&history.state&&history.state.gym){guarded=false;ignorePop=true;history.back()}
}catch(e){}}
function doBack(){S.err=null;
  if(S.mg){if(S.mg.g!=null)return A.mgBack();S.mg=null;return render()}
  if(S.cat){if(S.cat.q){S.cat.q='';return render()}if(S.cat.g!=null)return A.catBack();S.cat=null;return render()}
  if(S.sel||S.gsel){S.sel=null;S.gsel=null;S.confirm=null;return render()}
  if(S.sum){sumClose();return}
  if(TUT){closeTut();return render()}
  if(S.bmiInfo){S.bmiInfo=false;return render()}
  if(S.bgGal){S.bgGal=false;S.confirm=null;return render()}
  if(S.gearMenu){return closeGear()}
  if(S.exSearch){S.exSearch=false;return render()}
  if(S.calc){S.calc=null;return render()}
  if(S.skipFor){S.skipFor=null;return render()}
  if(S.endAsk){S.endAsk=false;return render()}
  if(S.confirm){S.confirm=null;return render()}
  if(S.replaceFor)return A.cancelRepl();
  if(S.noteForm){S.noteForm=null;return render()}
  if(S.groupForm){S.groupForm=null;return render()}
  if(S.view==='notes'&&S.noteGroup)return A.backNotes();
  if(S.view!=='home')return A.go('home');
  render()}
window.addEventListener('popstate',()=>{if(ignorePop){ignorePop=false;return}guarded=false;doBack()});
if(SET.name)greetCover();
init();
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
