<style>
/* Layout: one narrow phone column; condensed scoreboard numerals carry the identity, everything else stays quiet */
:root{
  --bg:#ECEEE9; --surface:#FFFFFF; --sunk:#E2E5DE; --ink:#14171A; --muted:#646B63; --line:#D3D7CF;
  --accent:#2346C8; --accent-ink:#FFFFFF; --accent-soft:#DCE2F8; --accent-text:#2346C8;
  --up:#1B7F45; --down:#B8332A; --warn:#B86A00; --scrim:rgba(20,23,26,.45); --glass-bg:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.75); --glass-hl:rgba(255,255,255,.55); --glass-sh:rgba(30,40,70,.2);
  --font-d:'Fira Sans Extra Condensed','Arial Narrow',Arial,sans-serif;
  --font-b:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191C1F; --sunk:#141719; --ink:#E9ECE7; --muted:#8D948C; --line:#2C3135;
  --accent:#7D98FF; --accent-ink:#0C1022; --accent-soft:#1E2646; --accent-text:#7D98FF; --up:#4CC07F; --down:#F07067; --warn:#F2B04C; --scrim:rgba(0,0,0,.62); --glass-bg:rgba(34,38,46,.6); --glass-brd:rgba(255,255,255,.13); --glass-hl:rgba(255,255,255,.1); --glass-sh:rgba(0,0,0,.55); color-scheme:dark}

:root[data-accent="red"]{--accent:#C8352B;--accent-ink:#FFFFFF;--accent-soft:#F8DEDB;--accent-text:#C8352B}
@media (prefers-color-scheme: dark){:root[data-accent="red"]:not([data-theme="light"]){--accent:#FF7B6F;--accent-ink:#1F0B09;--accent-soft:#43201D;--accent-text:#FF7B6F}}
:root[data-theme="dark"][data-accent="red"]{--accent:#FF7B6F;--accent-ink:#1F0B09;--accent-soft:#43201D;--accent-text:#FF7B6F}
:root[data-accent="orange"]{--accent:#D2600F;--accent-ink:#FFFFFF;--accent-soft:#FBE5D2;--accent-text:#B4520C}
@media (prefers-color-scheme: dark){:root[data-accent="orange"]:not([data-theme="light"]){--accent:#FF9C52;--accent-ink:#241206;--accent-soft:#42271A;--accent-text:#FF9C52}}
:root[data-theme="dark"][data-accent="orange"]{--accent:#FF9C52;--accent-ink:#241206;--accent-soft:#42271A;--accent-text:#FF9C52}
:root[data-accent="yellow"]{--accent:#E3AA00;--accent-ink:#1D1700;--accent-soft:#FBF0CC;--accent-text:#8A6500}
@media (prefers-color-scheme: dark){:root[data-accent="yellow"]:not([data-theme="light"]){--accent:#FFD34D;--accent-ink:#1D1700;--accent-soft:#3A3216;--accent-text:#FFD34D}}
:root[data-theme="dark"][data-accent="yellow"]{--accent:#FFD34D;--accent-ink:#1D1700;--accent-soft:#3A3216;--accent-text:#FFD34D}
:root[data-accent="green"]{--accent:#1E8A4C;--accent-ink:#FFFFFF;--accent-soft:#D8F0E1;--accent-text:#1E8A4C}
@media (prefers-color-scheme: dark){:root[data-accent="green"]:not([data-theme="light"]){--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}}
:root[data-theme="dark"][data-accent="green"]{--accent:#5BD08E;--accent-ink:#06180D;--accent-soft:#17331F;--accent-text:#5BD08E}
:root[data-accent="cyan"]{--accent:#0A86B8;--accent-ink:#FFFFFF;--accent-soft:#D4ECF6;--accent-text:#0A7AA8}
@media (prefers-color-scheme: dark){:root[data-accent="cyan"]:not([data-theme="light"]){--accent:#5CC8F0;--accent-ink:#04161E;--accent-soft:#12303B;--accent-text:#5CC8F0}}
:root[data-theme="dark"][data-accent="cyan"]{--accent:#5CC8F0;--accent-ink:#04161E;--accent-soft:#12303B;--accent-text:#5CC8F0}
:root[data-accent="blue"]{--accent:#2346C8;--accent-ink:#FFFFFF;--accent-soft:#DCE2F8;--accent-text:#2346C8}
@media (prefers-color-scheme: dark){:root[data-accent="blue"]:not([data-theme="light"]){--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}}
:root[data-theme="dark"][data-accent="blue"]{--accent:#7D98FF;--accent-ink:#0C1022;--accent-soft:#1E2646;--accent-text:#7D98FF}
:root[data-accent="gray"]{--accent:#5B6470;--accent-ink:#FFFFFF;--accent-soft:#E2E5E9;--accent-text:#4A525C}
@media (prefers-color-scheme: dark){:root[data-accent="gray"]:not([data-theme="light"]){--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}}
:root[data-theme="dark"][data-accent="gray"]{--accent:#A9B1BC;--accent-ink:#121418;--accent-soft:#2A2F36;--accent-text:#A9B1BC}
:root[data-accent="violet"]{--accent:#7A3DC8;--accent-ink:#FFFFFF;--accent-soft:#EADDF8;--accent-text:#7A3DC8}
@media (prefers-color-scheme: dark){:root[data-accent="violet"]:not([data-theme="light"]){--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}}
:root[data-theme="dark"][data-accent="violet"]{--accent:#B48CFF;--accent-ink:#170B29;--accent-soft:#2E2145;--accent-text:#B48CFF}

:root[data-anim="off"] *,:root[data-anim="off"] *::before,:root[data-anim="off"] *::after{animation:none!important;transition:none!important}
:root[data-anim="off"] :is(.btn,.pill,.tab,.exhead,.gear,.xbtn,.card,.nlink,.linkbtn,.seg button,.hist>button,.sw i){transform:none!important}
:root{--acc-hi:color-mix(in srgb,var(--accent) 72%,#fff);--acc-lo:color-mix(in srgb,var(--accent) 78%,#000)}
:root[data-accent="yellow"]{--acc-hi:color-mix(in srgb,var(--accent) 70%,#fff3a0);--acc-lo:color-mix(in srgb,var(--accent) 80%,#d06000)}
.gs1{stop-color:var(--acc-hi)} .gs2{stop-color:var(--acc-lo)}
:root[data-grad="on"] .btn.primary,:root[data-grad="on"] .banner,:root[data-grad="on"] .replbar,:root[data-grad="on"] .cal .c.on,:root[data-grad="on"] .prog span.on{background:linear-gradient(135deg,var(--acc-hi),var(--acc-lo));border-color:transparent}
:root[data-grad="on"] .chart .bar{fill:url(#gB)}
:root[data-grad="on"] .chart .ln{stroke:url(#gL)}
:root[data-grad="on"] .chart .dt.last{fill:var(--acc-lo)}
:root[data-grad="on"] .sw i{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#fff),color-mix(in srgb,var(--c) 78%,#000))}
:root[data-glass="on"] body{background:var(--bg)}
:root[data-glass="on"] :is(.card,.ex,.hist,.confirm,.empty,.tiles>div,.strip){background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-hl),0 12px 32px -16px var(--glass-sh);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%)}
:root[data-glass="on"] .ex.open{border-color:color-mix(in srgb,var(--accent) 55%,var(--glass-brd))}
:root[data-glass="on"] .ex.pick{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
:root[data-glass="on"] .strip{padding-inline:14px;border-top:1px solid var(--glass-brd)}
:root[data-glass="on"] .strip>div+div{border-left-color:var(--glass-brd)}
:root[data-glass="on"] .tiles{background:transparent;border:0;gap:8px;overflow:visible}
:root[data-glass="on"] .tiles>div{border-radius:18px}
:root[data-glass="on"] .hint{background:color-mix(in srgb,var(--sunk) 55%,transparent);border-radius:12px}
:root[data-glass="on"] .setform{background:color-mix(in srgb,var(--accent-soft) 65%,transparent);border-radius:18px;border:1px solid var(--glass-brd)}
:root[data-glass="on"] .btn{border-radius:999px;background:var(--glass-bg);border-color:var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 6px 18px -10px var(--glass-sh);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
:root[data-glass="on"] .btn.primary,:root[data-glass="on"] .banner,:root[data-glass="on"] .replbar{background-color:var(--accent);background-image:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 55%);border:1px solid color-mix(in srgb,var(--accent) 82%,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 12px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
:root[data-glass="on"][data-grad="on"] .btn.primary,:root[data-glass="on"][data-grad="on"] .banner,:root[data-glass="on"][data-grad="on"] .replbar{background-image:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,0) 55%),linear-gradient(135deg,var(--acc-hi),var(--acc-lo))}
:root[data-glass="on"] .banner{border-radius:22px}
:root[data-glass="on"] .replbar{border-radius:18px}
:root[data-glass="on"] .banner .btn,:root[data-glass="on"] .replbar .btn{background:var(--accent-ink);color:var(--accent-text);border-color:transparent}
:root[data-glass="on"] .btn.danger{color:var(--down)}
:root[data-glass="on"] :is(input,textarea,select){background:color-mix(in srgb,var(--surface) 62%,transparent);border-color:var(--glass-brd);border-radius:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-glass="on"] .seg{background:var(--glass-bg);border:1px solid var(--glass-brd);border-radius:999px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .seg button{border-radius:999px}
:root[data-glass="on"] .seg button.on{box-shadow:inset 0 1px 0 var(--glass-hl),0 3px 10px -4px var(--glass-sh)}
:root[data-glass="on"] .pill,:root[data-glass="on"] .gear{background:var(--glass-bg);border-color:var(--glass-brd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
:root[data-glass="on"] .gear{border-radius:50%;box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .cal .c{border-radius:50%}
:root[data-glass="on"] .setrow{border-bottom-color:var(--glass-brd)}
:root[data-glass="on"] body::before{background:var(--glass-bg);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
:root[data-glass="on"] .whead{background:var(--glass-bg);border-bottom:1px solid var(--glass-brd);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%)}
:root[data-glass="on"] nav.tabs{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:4px;border-radius:30px;background:var(--glass-bg);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hl),0 14px 34px -14px var(--glass-sh);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
:root[data-glass="on"] .tab{border-radius:24px;padding:7px 0 8px}
:root[data-glass="on"] .tabind::before{border-radius:24px;inset:0}
:root[data-glass="on"] .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .wrap.nonav{padding-bottom:40px}
:root[data-glass="on"] .sheet{background:var(--glass-bg);border:1px solid var(--glass-brd);border-bottom:0;border-radius:28px 28px 0 0;-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 var(--glass-hl)}
:root[data-glass="on"] .toast{background:color-mix(in srgb,var(--ink) 72%,transparent);border-radius:999px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);bottom:calc(92px + env(safe-area-inset-bottom,0px))}
:root[data-glass="on"] .setconf{background:color-mix(in srgb,var(--sunk) 60%,transparent);border-radius:14px}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;display:flex;flex-direction:column;gap:22px}
.wrap.nonav{padding-bottom:40px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;font-weight:700;letter-spacing:.01em}
h1{font-size:40px;line-height:1;text-transform:uppercase}
h2{font-size:22px;text-transform:uppercase;line-height:1.1}
h3{font-size:20px;line-height:1.15}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.sec{display:flex;flex-direction:column;gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:8px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--up);display:inline-block}
.sync.local i{background:var(--down)}

.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.strip>div{padding:10px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip>div+div{padding-left:12px;border-left:1px solid var(--line)}
.strip .num{font-size:30px;line-height:1}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px/1 var(--font-b);min-height:44px;padding:0 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:focus-visible,input:focus-visible,select:focus-visible,.exhead:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:54px;font-size:17px}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--down);background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.icon{width:40px;padding:0;min-height:40px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tpl .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tpl .acts{display:flex;gap:8px}
.tpl .acts .primary{flex:1}

.banner{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.banner .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-family:var(--font-d);font-size:20px;text-transform:uppercase}

/* workout */
.whead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.prog{display:flex;gap:4px}
.prog span{flex:1;height:5px;border-radius:3px;background:var(--sunk)}
.prog span.on{background:var(--accent)}
.prog span.part{background:var(--accent-soft)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.open{border-color:var(--ink)}
.exhead{width:100%;appearance:none;background:none;border:0;color:inherit;text-align:left;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font:inherit}
.exhead .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.exhead h3{overflow-wrap:anywhere}
.chip{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.go{background:var(--accent-soft);color:var(--accent-text)}
.chip.done{background:var(--ink);color:var(--bg)}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.hint{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.hint b{color:var(--ink);font-weight:600}
.sets{display:grid;grid-template-columns:auto 1fr 1fr auto;border-top:1px solid var(--line)}
.sets>div{display:flex;align-items:center;min-height:44px;padding:0;border-bottom:1px solid var(--line)}
.sets>.h{min-height:30px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sets .n{padding-right:18px;color:var(--muted)}
.sets .x{justify-content:flex-end}
.xbtn{appearance:none;border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.xbtn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;fill:none}
.xbtn:hover{color:var(--down);background:var(--sunk)}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setconf{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px!important;background:var(--sunk);border-radius:8px;margin:4px 0;font-size:14px;border-bottom:0!important}
.trash{border-top:1px solid var(--line);padding-top:6px}
.trashhead{appearance:none;border:0;background:none;color:var(--ink);font:inherit;display:flex;justify-content:space-between;align-items:center;padding:10px 0;cursor:pointer;width:100%}
.trashhead svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.trashrow{padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap}
.sets .num{font-size:20px;line-height:1.1}
.sets .unit{font-family:var(--font-b);font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.setform{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px}
.setform .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select{font:500 16px var(--font-b);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%;min-width:0}
.setform input{font:700 24px var(--font-d);font-variant-numeric:tabular-nums}
.exacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--down);font-size:13px}

const resolved=e=>e.done||e.skipped||e.replacedBy;
function vWorkout(){
  const w=active(),all=w.exercises||[],ex=all.filter(e=>!e.off),offs=all.filter(e=>e.off);

  let h=`<div class="wrap nonav"><div class="whead"><div class="row between"><button class="btn sm ghost" data-act="go" data-id="home">← ${L('Назад','Back')}</button><span class="small muted">${L('Начало','Started')} ${fT(w.startedAt)}</span></div>
  <h2 style="font-size:28px">${esc(w.name)}</h2>
  <div class="prog">${ex.map(e=>`<span class="${e.done?'on':e.skipped||e.replacedBy?'skip':(e.log&&e.log.length)||e.pending?'part':''}"></span>`).join('')}</div>
  <div class="small muted">${L('Завершено','Done')} ${ex.filter(resolved).length} ${L('из','of')} ${ex.length} · ${L('подходов','sets')} ${setCount(w)} · ${L('выполнено','completed')} ${progress(w).pct}%</div>`;
  if(rf){const nc=ex.filter(isCand).length;h+=`<div class="replbar"><div><div class="label" style="color:inherit;opacity:.85">${L('Замена','Swap')}</div><b>${L('Выберите, чем заменить','Choose a replacement for')} «${esc(rf.name)}»</b>${nc?'':`<div class="small" style="opacity:.85">${L('Нет свободных упражнений: все уже начаты или завершены.','No free exercises: all are started or finished.')}</div>`}</div><button class="btn sm" data-act="cancelRepl">${L('Отмена','Cancel')}</button></div>`}
  h+='</div><div class="stack">';
  for(const e of ex){
    const n=(e.log||[]).length,pl=parseInt(e.sets)||0,ov=k=>pl&&k>pl?`<b class="over">${k}</b>`:k;
    const from=e.replaces?all.find(x=>x.id===e.replaces):null;
    const sub=`${e.equip?`<b class="eqtag">${esc(e.equip)}</b> · `:''}${L('План','Plan')}: ${e.sets||'—'} × ${esc(e.reps||'—')}${from?` · ${L('вместо','instead of')} «${esc(from.name)}»`:''}`;
    if(rf){
      if(isCand(e))h+=`<div class="ex pick ${fx('pick')}" style="--i:${ex.indexOf(e)}" id="ex-${e.id}"><button class="exhead" data-act="pickRepl" data-id="${e.id}"><span class="t"><h3>${esc(e.name)}</h3><span class="small muted">${sub}</span></span><span class="chip go">${L('Выбрать','Choose')}</span></button></div>`;
      else h+=`<div class="ex dim" id="ex-${e.id}"><div class="exhead" style="cursor:default"><span class="t"><h3>${esc(e.name)}</h3><span class="small muted">${sub}</span></span><span class="chip">${e.id===rf.id?L('Заменяется','Swapping'):L('Недоступно','Unavailable')}</span></div></div>`;
      continue;
    }

/* ---------- charts ---------- */
function ticksFor(mn,mx,n){const sp=mx-mn||1,s0=sp/n,mag=10**Math.floor(Math.log10(s0)),e=s0/mag,st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const a=Math.floor(mn/st)*st,b=Math.ceil(mx/st)*st,out=[];for(let v=a;v<=b+st/2;v+=st)out.push(Math.round(v*1000)/1000);return out}
function lineChart(pts,unit){
  const W=340,H=190,Lp=42,R=16,T=22,B=26;
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);
  if(mn===mx){mn=mn-Math.max(1,mn*0.1);mx=mx+Math.max(1,mx*0.1)}
  const tk=ticksFor(Math.max(0,mn-(mx-mn)*0.1),mx+(mx-mn)*0.1,4);mn=tk[0];mx=tk[tk.length-1];
  const x=i=>pts.length===1?Lp+(W-Lp-R)/2:Lp+i*(W-Lp-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('График','Chart')}"><defs><linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="${Lp}" y1="0" x2="${W-R}" y2="0"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  for(const t of tk)s+=`<line class="grid" x1="${Lp}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${Lp-6}" y="${y(t)+3.5}" text-anchor="end">${num(t)}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  if(pts.length>1)s+=`<path class="ar" d="${d} L${x(pts.length-1)} ${H-B} L${x(0)} ${H-B} Z"/><path class="ln" d="${d}"/>`;
  const lbl=new Set([0,pts.length-1]);if(pts.length>4)lbl.add(Math.floor((pts.length-1)/2));
  pts.forEach((p,i)=>{const last=i===pts.length-1;s+=`<circle class="dt ${last?'last':''}" cx="${x(i)}" cy="${y(p.y)}" r="${last?5:3.5}"/>`;if(lbl.has(i))s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${pts.length===1?'middle':i===0?'start':last?'end':'middle'}">${fD(p.x)}</text>`});
  const lp=pts[pts.length-1];s+=`<text class="vl" x="${Math.min(x(pts.length-1),W-R)}" y="${y(lp.y)-10}" text-anchor="${pts.length===1?'middle':'end'}">${num(lp.y)}${unit}</text>`;
  return s+'</svg>';
}
function barChart(weeks){
  const W=340,H=150,Lp=8,R=8,T=18,B=24,n=weeks.length,mx=Math.max(3,...weeks.map(w=>w.c));
  const bw=(W-Lp-R)/n;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Тренировки по неделям','Workouts per week')}"><defs><linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="gs1"/><stop offset="1" class="gs2"/></linearGradient></defs>`;
  weeks.forEach((w,i)=>{const h=w.c?(H-T-B)*w.c/mx:3,x=Lp+i*bw+bw*0.18,bwi=bw*0.64,y=H-B-h;
    s+=`<rect class="${w.c?'bar':'bar0'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`;
    if(w.c)s+=`<text class="vl" x="${(x+bwi/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${w.c}</text>`;
    if(i%2===(n-1)%2)s+=`<text x="${(x+bwi/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${new Date(w.t).toLocaleDateString(LOC(),{day:'2-digit',month:'2-digit'})}</text>`;});
  return s+'</svg>';
}

function vStats(){
  const f=finished();
  let h=`<div class="wrap"><div class="top"><h1>${L('Статистика','Stats')}</h1></div>`;
  if(!f.length)return h+`<div class="empty"><b>${L('Пока нет данных','No data yet')}</b><span>${L('Здесь появятся посещения, графики по упражнениям и рекорды после первой завершённой тренировки.','Attendance, exercise charts and records will appear here after your first finished workout.')}</span></div></div>`;
  const t=Date.now(),wk=sow(t),pwk=sow(wk-DAY);
  const cnt=(a,b)=>f.filter(w=>w.startedAt>=a&&w.startedAt<b).length;
  const m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(),pm0=new Date(now.getFullYear(),now.getMonth()-1,1).getTime();
  const cw=cnt(wk,Infinity),pw=cnt(pwk,wk),cm=cnt(m0,Infinity),pm=cnt(pm0,m0);
  const weeks=[];for(let i=11;i>=0;i--){const d=new Date(wk);d.setDate(d.getDate()-7*i);const a=d.getTime(),e=new Date(d);e.setDate(e.getDate()+7);weeks.push({t:a,c:cnt(a,e.getTime())})}
  const avg8=weeks.slice(3,11).reduce((a,w)=>a+w.c,0)/8;
  let streak=0;for(let i=weeks.length-1;i>=0;i--){if(weeks[i].c)streak++;else if(i===weeks.length-1)continue;else break}
  h+=`<section class="sec"><h2>${L('Посещения','Attendance')}</h2><div class="tiles">
  <div><span class="label">${L('Эта неделя','This week')}</span><span class="num">${cw}</span>${delta(cw-pw)}<span class="small muted">${L('прошлая','last')}: ${pw}</span></div>
  <div><span class="label">${L('Этот месяц','This month')}</span><span class="num">${cm}</span>${delta(cm-pm)}<span class="small muted">${L('прошлый','last')}: ${pm}</span></div>
  <div><span class="label">${L('В среднем / нед.','Avg / week')}</span><span class="num">${num(avg8)}</span><span class="small muted">${L('за 8 полных недель','over 8 full weeks')}</span></div>
  <div><span class="label">${L('Всего','Total')}</span><span class="num">${f.length}</span><span class="small muted">${L('серия','streak')}: ${streak} ${P(streak,['неделя','недели','недель'],['week','weeks'])}${L(' подряд','')}</span></div>
  </div></section>`;
  h+=`<section class="sec"><div class="row between"><h2>${L('По неделям','By week')}</h2><span class="small muted">${L('12 недель','12 weeks')}</span></div>${barChart(weeks)}</section>`;
  const days=new Set(f.map(w=>{const d=new Date(w.startedAt);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}));

function flip(sel,fn){S.holdUntil=Date.now()+650;const before=new Map();document.querySelectorAll(sel).forEach(el=>before.set(el.dataset.key,el.getBoundingClientRect().top));fn();if(!motionOK())return;

function loadBg(file){if(!/^image\//.test(file.type)){toast(L('Выберите файл изображения.','Choose an image file.'));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);let max=1100,q=.75,out='';const c=document.createElement('canvas'),x=c.getContext('2d');
    for(let i=0;i<8;i++){const k=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<230000)break;if(q>.5)q-=.1;else max=Math.round(max*.8)}
    if(out.length>=250000){toast(L('Не удалось сжать фото. Попробуйте другое.','Could not compress the photo. Try another one.'));return}
    BG=out;try{localStorage.setItem(BGK,BG)}catch(e){}applyBg();render();

const LB=2.20462262;
function calcEval(src){const t=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let i=0;
  const peek=()=>t[i],num=()=>{let m=t.slice(i).match(/^\d*\.?\d+|^\d+\.?/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const fac=()=>{if(peek()==='-'){i++;return -fac()}if(peek()==='('){i++;const v=expr();if(peek()!==')')throw 0;i++;return v}return num()};
  const term=()=>{let v=fac();while(peek()==='*'||peek()==='/'){const o=t[i++],r=fac();v=o==='*'?v*r:v/r}return v};
  const expr=()=>{let v=term();while(peek()==='+'||peek()==='-'){const o=t[i++],r=term();v=o==='+'?v+r:v-r}return v};
  const v=expr();if(i!==t.length||!isFinite(v))throw 0;return v}
const cNum=v=>{const r=Math.round(v*100)/100;return EN()?String(r):String(r).replace('.',',')};
const cShow=e=>EN()?e:e.replace(/\./g,',');

  const dot=EN()?'.':',';

  <div class="cdisp"><div class="cnote">${esc(c.note||'')}</div><div class="cexpr num">${esc(cShow(c.expr)||'0')}</div><div class="cprev">${esc(prev)}</div></div>
  <div class="cconv"><button class="btn" data-act="calcConv" data-id="kg">${L('кг → lb','kg → lb')}</button><button class="btn" data-act="calcConv" data-id="lb">${L('lb → кг','lb → kg')}</button></div>

    if(!ex.length){S.err={id:'tpl',k:'tex'};return render()}
    const t={id:d.id,name:d.name,exercises:ex,createdAt:d.createdAt||Date.now()};{const old=S.templates.find(x=>x.id===d.id);if(old&&old.order!=null)t.order=old.order;else if(!old){const T=tpls();if(T.some(x=>x.order!=null))t.order=T.length}}
    const i=S.templates.findIndex(x=>x.id===t.id);if(i>=0)S.templates[i]=t;else S.templates.push(t);
    persist('templates',t);S.draft=null;S.err=null;S.view='home';render();window.scrollTo(0,0);toast(L('Шаблон сохранён','Template saved'))},
  delTpl(){const id=S.draft.id,i=S.templates.findIndex(x=>x.id===id);S.draft=null;S.confirm=null;S.view='home';S.fx={t:'view'};if(i>=0){const t=structuredClone(S.templates[i]);t.deletedAt=Date.now();S.templates[i]=t;persist('templates',t)}render();window.scrollTo(0,0);toast(L('Шаблон в корзине','Template moved to trash'))},
  restoreT(id){const i=S.templates.findIndex(x=>x.id===id);if(i<0)return;const t=structuredClone(S.templates[i]);delete t.deletedAt;S.templates[i]=t;persist('templates',t);render();toast(L('Шаблон восстановлен','Template restored'))},
  tplTrashToggle(){S.tplTrashOpen=!S.tplTrashOpen;S.confirm=null;render()},
  clearTplTrash(){const ids=S.templates.filter(t=>t.deletedAt).map(t=>t.id);S.templates=S.templates.filter(t=>!t.deletedAt);ids.forEach(id=>remove('templates',id));S.confirm=null;S.tplTrashOpen=false;render();toast(L('Корзина очищена','Trash emptied'))},
  cal(d){let m=S.calM+ +d,y=S.calY;if(m<0){m=11;y--}if(m>11){m=0;y++}S.calM=m;S.calY=y;render()},
  metric(m){S.metric=m;render()},
  histToggle(id){S.histOpen=S.histOpen===id?null:id;S.confirm=null;render()},
  delW(id){const i=S.workouts.findIndex(w=>w.id===id);if(i<0)return;const w=structuredClone(S.workouts[i]);w.deletedAt=Date.now();S.workouts[i]=w;persist('workouts',w);S.confirm=null;S.histOpen=null;render();toast(L('Тренировка в корзине','Workout moved to trash'))},
  restoreW(id){const i=S.workouts.findIndex(w=>w.id===id);if(i<0)return;const w=structuredClone(S.workouts[i]);delete w.deletedAt;S.workouts[i]=w;persist('workouts',w);render();toast(L('Тренировка восстановлена','Workout restored'))},
  trashToggle(){S.trashOpen=!S.trashOpen;S.confirm=null;render()},
  clearTrash(){const ids=S.workouts.filter(w=>w.deletedAt).map(w=>w.id);S.workouts=S.workouts.filter(w=>!w.deletedAt);ids.forEach(id=>remove('workouts',id));S.confirm=null;S.trashOpen=false;render();toast(L('Корзина очищена','Trash emptied'))},
  gKind(k){S.groupKind=k;render()},
  newGroup(){S.groupKind='links';S.groupForm='new';S.err=null;render();const el=document.getElementById('gName');if(el)el.focus()},
  renameGroup(){const g=S.notes.find(x=>x.id===S.noteGroup);S.groupKind=g&&g.kind==='text'?'text':'links';S.groupForm='rename';S.err=null;render();const el=document.getElementById('gName');if(el){el.focus();el.select()}},
  cancelGroup(){S.groupForm=null;S.err=null;render()},
  saveGroup(){const el=document.getElementById('gName'),name=(el?el.value:'').trim();if(!name){S.err={id:'group'};return render()}
    S.err=null;if(S.groupForm==='rename'&&S.noteGroup){S.groupForm=null;const kind=S.groupKind==='text'?'text':'links';mutG(S.noteGroup,g=>{g.name=name;g.kind=kind});return}
    const g={id:uid(),name,kind:S.groupKind==='text'?'text':'links',createdAt:Date.now(),items:[]};S.notes.push(g);persist('notes',g);S.groupForm=null;S.noteGroup=g.id;S.fx={t:'view'};render();toast(L('Группа создана','Group created'))},
  openGroup(id){S.noteGroup=id;S.nTrashOpen=false;S.noteForm=null;S.groupForm=null;S.confirm=null;S.err=null;S.fx={t:'view'};render();window.scrollTo(0,0)},
  backNotes(){S.noteGroup=null;S.noteForm=null;S.groupForm=null;S.confirm=null;S.err=null;S.fx={t:'view'};render();window.scrollTo(0,0)},
  delGroup(){const id=S.noteGroup,i=S.notes.findIndex(x=>x.id===id);S.noteGroup=null;S.confirm=null;S.groupForm=null;S.noteForm=null;S.fx={t:'view'};if(i>=0){const g=structuredClone(S.notes[i]);g.deletedAt=Date.now();S.notes[i]=g;persist('notes',g)}render();window.scrollTo(0,0);toast(L('Группа в корзине','Group moved to trash'))},
  restoreGroup(id){const i=S.notes.findIndex(x=>x.id===id);if(i<0)return;const g=structuredClone(S.notes[i]);delete g.deletedAt;S.notes[i]=g;persist('notes',g);render();toast(L('Группа восстановлена','Group restored'))},
  gTrashToggle(){S.gTrashOpen=!S.gTrashOpen;S.confirm=null;render()},
  clearGTrash(){const ids=S.notes.filter(x=>x.deletedAt).map(x=>x.id);S.notes=S.notes.filter(x=>!x.deletedAt);ids.forEach(id=>remove('notes',id));S.confirm=null;S.gTrashOpen=false;render();toast(L('Корзина очищена','Trash emptied'))},
  newNote(){S.noteForm={id:null};S.confirm=null;S.err=null;render();const el=document.getElementById('nT-new');if(el){el.focus();el.scrollIntoView({block:'center'})}},
  editNote(id){S.noteForm={id};S.confirm=null;S.err=null;render();const el=document.getElementById('nT-'+id);if(el)el.focus()},
  cancelNote(){S.noteForm=null;S.err=null;render()},
  saveNote(k){const g=v=>((document.getElementById(v+'-'+k)||{}).value||'').trim();const title=g('nT'),raw=g('nU'),text=g('nX');
    if(!title&&!raw&&!text){S.err={id:'note',k:'nempty'};return render()}
    const url=normUrl(raw);if(url===null){S.err={id:'note',k:'url'};return render()}
    S.err=null;const id=S.noteForm&&S.noteForm.id;S.noteForm=null;
    mutG(S.noteGroup,gr=>{if(id){const n=gr.items.find(x=>x.id===id);if(n)Object.assign(n,{title,url:document.getElementById('nU-'+k)?url:(n.url||''),text,updatedAt:Date.now()})}else gr.items.push({id:uid(),title,url,text,createdAt:Date.now()})});toast(L('Заметка сохранена','Note saved'))},
  delNote(id){S.confirm=null;if(S.noteForm&&S.noteForm.id===id)S.noteForm=null;mutG(S.noteGroup,g=>{const n=g.items.find(x=>x.id===id);if(n)n.deletedAt=Date.now()});toast(L('Заметка в корзине','Note moved to trash'))},
  restoreNote(id){mutG(S.noteGroup,g=>{const n=g.items.find(x=>x.id===id);if(n)delete n.deletedAt});toast(L('Заметка восстановлена','Note restored'))},
  nTrashToggle(){S.nTrashOpen=!S.nTrashOpen;S.confirm=null;render()},
  clearNTrash(){S.confirm=null;S.nTrashOpen=false;mutG(S.noteGroup,g=>{g.items=g.items.filter(x=>!x.deletedAt)});toast(L('Корзина очищена','Trash emptied'))},
  delSet(v){const[id,i]=v.split(':');S.confirm=null;mutW(w=>{const e=exOf(w,id);e.log.splice(+i,1);if(!e.log.length)e.done=false});toast(L('Подход удалён','Set deleted'))}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset.id,e)});
function cleanNum(v,dec){if(!dec)return v.replace(/\D/g,'');v=v.replace(/[^\d.,]/g,'');const m=v.match(/^(\d*)([.,]?)(\d*)/);return m[1]+(m[2]&&m[1]?m[2]+m[3].replace(/[.,]/g,'').slice(0,2):'')}
app.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.num){const v=cleanNum(t.value,t.dataset.num==='dec');if(v!==t.value)t.value=v}},true);
app.addEventListener('input',e=>{const t=e.target;if(!S.draft)return;if(t.dataset.f==='name')S.draft.name=t.value;else if(t.dataset.ex!=null){const x=S.draft.exercises[+t.dataset.ex];if(x)x[t.dataset.k]=t.value}});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='bgX'||t.id==='bgY'){const v=+t.value;SET[t.id]=v;document.getElementById(t.id+'V').textContent=v+'%';applyBg();return}if(t.id==='btnT'){SET.btnT=+t.value;document.getElementById('btnTV').textContent=SET.btnT+'%';applyBg();return}if(t.id==='bgBlur'||t.id==='bgVis'){const v=+t.value;if(t.id==='bgBlur'){SET.bgBlur=v;document.getElementById('bgBlurV').textContent=v}else{SET.bgVis=v;document.getElementById('bgVisV').textContent=v+'%'}applyBg()}});
app.addEventListener('change',e=>{if(['bgBlur','bgVis','btnT','bgX','bgY'].includes(e.target.id)){saveSettings();if(e.target.id==='bgX'||e.target.id==='bgY')render();return}if(e.target.id==='impFile'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importData(f);return}if(e.target.id==='bgFile'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)loadBg(f);return}if(e.target.id==='statEx'){S.statEx=e.target.value;render()}if(e.target.id==='memDate'){const v=e.target.value||'';if(v!==SET.member){SET.member=normS({member:v}).member;saveSettings();render();toast(SET.member?L('Дата абонемента сохранена','Membership date saved'):L('Абонемент убран с главного экрана','Membership hidden from home'))}}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.enter){e.preventDefault();A.logSet(e.target.dataset.enter)}if(e.key==='Enter'&&e.target.dataset.lenter){e.preventDefault();A.authGo()}if(e.key==='Enter'&&e.target.dataset.genter){e.preventDefault();A.saveGroup()}});
/* ---------- system back gesture ---------- */
let guarded=false,ignorePop=false;
const canBack=()=>S.ready&&S.view!=='login'&&!!(S.calc||S.skipFor||S.endAsk||S.confirm||S.replaceFor||S.noteForm||S.groupForm||S.noteGroup||S.view!=='home');
function syncHistory(){try{
  if(canBack()&&!guarded){history.pushState({gym:1},'');guarded=true}
  else if(!canBack()&&guarded&&history.state&&history.state.gym){guarded=false;ignorePop=true;history.back()}
}catch(e){}}
function doBack(){S.err=null;
  if(S.calc){S.calc=null;return render()}
  if(S.skipFor){S.skipFor=null;return render()}
  if(S.endAsk){S.endAsk=false;return render()}
  if(S.confirm){S.confirm=null;return render()}
  if(S.replaceFor)return A.cancelRepl();
  if(S.noteForm){S.noteForm=null;return render()}
  if(S.groupForm){S.groupForm=null;return render()}
  if(S.view==='notes'&&S.noteGroup)return A.backNotes();
  if(S.view!=='home')return A.go('home');
  render()}
window.addEventListener('popstate',()=>{if(ignorePop){ignorePop=false;return}guarded=false;doBack()});
init();
})();
</script>
